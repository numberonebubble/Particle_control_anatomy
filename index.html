<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bio-Interactive Particle System</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        
        /* Main 3D Canvas */
        #c { width: 100vw; height: 100vh; display: block; }

        /* UI Overlay - Heart / Resp (Top Right) */
        #hr-container {
            position: absolute; top: 20px; right: 20px;
            color: #00ff88; background: rgba(0, 20, 10, 0.8);
            padding: 15px; border-radius: 10px; border: 1px solid #00ff88;
            text-align: right; pointer-events: none;
        }
        #bpm-display { font-size: 3rem; font-weight: bold; transition: opacity 0.2s ease, color 0.2s ease; }
        #bpm-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; transition: opacity 0.2s ease, color 0.2s ease; }

        /* Respiration UI */
        #resp-display { font-size: 1.6rem; font-weight: bold; margin-top: 8px; transition: opacity 0.2s ease, color 0.2s ease; }
        #resp-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; transition: opacity 0.2s ease, color 0.2s ease; }

        /* Quality text */
        #hr-quality, #resp-quality {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-top: 4px;
            transition: opacity 0.2s ease, color 0.2s ease;
        }

        /* UI Overlay - Webcam (Bottom Right) */
        #webcam-container {
            position: absolute; bottom: 20px; right: 20px;
            width: 240px; height: 180px;
            border-radius: 10px; overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
        }
        #input_video {
            width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
        }

        /* Status / Instructions */
        #status {
            position: absolute; top: 20px; left: 20px;
            color: rgba(255, 255, 255, 0.7); pointer-events: none;
        }

        /* Hidden Canvas for PPG / respiration processing */
        #ppg-canvas { display: none; }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>
<body>

    <div id="status">
        <h3>System Ready</h3>
        <p>Make a <strong>fist</strong> to form the heart and start HR.</p>
        <p>Relax or open your hand to dissipate the particles.</p>
    </div>

    <div id="hr-container">
        <div id="bpm-display">--</div>
        <div id="bpm-label">Heart Rate (BPM)</div>
        <div id="hr-quality">HR Q: --</div>

        <div id="resp-display">--</div>
        <div id="resp-label">Respiration (Br/Min)</div>
        <div id="resp-quality">Resp Q: --</div>
    </div>

    <div id="webcam-container">
        <video id="input_video" autoplay playsinline></video>
    </div>

    <canvas id="ppg-canvas"></canvas>
    
    <canvas id="c"></canvas>

<script>
/**
 * Helpers
 */
function clamp01(x) {
    return Math.max(0, Math.min(1, x));
}

/**
 * PART 1: THREE.JS SETUP & PARTICLE SYSTEM
 */
const canvas = document.querySelector('#c');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true, alpha: true});
renderer.setSize(window.innerWidth, window.innerHeight);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.z = 30;
camera.lookAt(0, 0, 0); // Centre screen focus

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.02);

// Particle Configuration
const PARTICLE_COUNT = 8000;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLE_COUNT * 3);
const velocities = new Float32Array(PARTICLE_COUNT * 3);
const heartBasePositions = new Float32Array(PARTICLE_COUNT * 3); // Stable heart template

// Random starting positions (cloud)
for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
    positions[i] = (Math.random() - 0.5) * 60;
    velocities[i] = (Math.random() - 0.5) * 0.5;
}
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

/**
 * Build a SOLID, DENSE, UPRIGHT HEART as a 3D volume.
 */
(function initHeartShape() {
    const scaleXY = 9.0;   // scale for x,y
    const scaleZ  = 4.0;   // thickness in z

    const gridN = 26; // 26^3 = 17,576 candidates
    const candidates = [];

    for (let ix = 0; ix < gridN; ix++) {
        const x2d = -1 + (2 * ix) / (gridN - 1); // -1..1

        for (let iy = 0; iy < gridN; iy++) {
            const y2d = -1.3 + (2.6 * iy) / (gridN - 1); // -1.3..1.3

            // Implicit 2D heart test
            const x2 = x2d * x2d;
            const y2 = y2d * y2d;
            const a  = x2 + y2 - 1;
            const heartVal = a * a * a - x2 * y2d * y2d * y2d;

            if (heartVal > 0) continue; // outside

            for (let iz = 0; iz < gridN; iz++) {
                const z2d = -1 + (2 * iz) / (gridN - 1); // -1..1

                candidates.push({
                    x: x2d * scaleXY,
                    y: y2d * scaleXY,   // upright: lobes up, point down
                    z: z2d * scaleZ     // extruded thickness
                });
            }
        }
    }

    if (candidates.length < PARTICLE_COUNT) {
        console.warn('Not enough heart candidates, falling back to random fill');
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const i3 = i * 3;
            heartBasePositions[i3]     = (Math.random() - 0.5) * scaleXY * 2;
            heartBasePositions[i3 + 1] = (Math.random() - 0.5) * scaleXY * 2;
            heartBasePositions[i3 + 2] = (Math.random() - 0.5) * scaleZ * 2;
        }
        return;
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        const idx = Math.floor((i / (PARTICLE_COUNT - 1)) * (candidates.length - 1));
        const c = candidates[idx];

        heartBasePositions[i3]     = c.x;
        heartBasePositions[i3 + 1] = c.y;
        heartBasePositions[i3 + 2] = c.z;
    }
})();

// Particle Material
const circleCanvas = document.createElement('canvas');
circleCanvas.width = 32;
circleCanvas.height = 32;
const ctx = circleCanvas.getContext('2d');
ctx.beginPath();
ctx.arc(16, 16, 15, 0, 2 * Math.PI);
ctx.fillStyle = '#ffffff';
ctx.fill();
const sprite = new THREE.CanvasTexture(circleCanvas);

const material = new THREE.PointsMaterial({
    size: 0.3,
    map: sprite,
    color: 0xff2266,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});

const particleSystem = new THREE.Points(geometry, material);
particleSystem.position.set(0, 0, 0);
scene.add(particleSystem);

// Logic Variables
let handDetected = false;
let lastHandTime = 0;
let heartActive = false;

// Heartbeat animation state
let currentBpm = 60;
let heartPhase = 0;
let lastFrameTime = performance.now();

/**
 * PART 2: MEDIAPIPE HAND TRACKING & GESTURE LOGIC
 */
const videoElement = document.getElementById('input_video');

function onResults(results) {
    const handsResults = results.multiHandLandmarks;

    if (handsResults && handsResults.length > 0) {
        handDetected = true;
        lastHandTime = Date.now();

        const lm = handsResults[0];

        const isFingerCurled = (tipIdx, pipIdx) => {
            const dTip = Math.sqrt(
                Math.pow(lm[tipIdx].x - lm[0].x, 2) +
                Math.pow(lm[tipIdx].y - lm[0].y, 2)
            );
            const dPip = Math.sqrt(
                Math.pow(lm[pipIdx].x - lm[0].x, 2) +
                Math.pow(lm[pipIdx].y - lm[0].y, 2)
            );
            return dTip < dPip;
        };

        const thumbOpen  = !isFingerCurled(4, 2);
        const indexOpen  = !isFingerCurled(8, 6);
        const middleOpen = !isFingerCurled(12, 10);
        const ringOpen   = !isFingerCurled(16, 14);
        const pinkyOpen  = !isFingerCurled(20, 18);

        const fingersOpenCount = [thumbOpen, indexOpen, middleOpen, ringOpen, pinkyOpen]
            .filter(Boolean).length;

        if (fingersOpenCount <= 1) {
            heartActive = true;
            material.color.setHex(0xff2266);
        } else {
            heartActive = false;
            material.color.setHex(0x00ffff);
        }
    } else {
        handDetected = false;
        heartActive = false;
    }
}

const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});
hands.onResults(onResults);


/**
 * PART 3: PPG HEART RATE MONITOR (FOREHEAD ROI, AMBIENT ROBUST + QUALITY)
 */
const ppgCanvas = document.getElementById('ppg-canvas');
const ppgCtx = ppgCanvas.getContext('2d', { willReadFrequently: true });
const bpmDisplay = document.getElementById('bpm-display');
const bpmLabel = document.getElementById('bpm-label');
const respDisplay = document.getElementById('resp-display');
const respLabel = document.getElementById('resp-label');
const hrQualityDisplay = document.getElementById('hr-quality');
const respQualityDisplay = document.getElementById('resp-quality');

const signalBuffer = [];
const BUFFER_SIZE = 240; // ~8s at 30fps
let lastBPMPulses = [];
let lastBpmCalcTime = 0;
const BPM_UPDATE_INTERVAL = 900;

let hrQuality = 0;

// For motion artifact estimation
let lastGreenNorm = null;
let ppgDerivBuffer = [];

function processPPG() {
    if (videoElement.paused || videoElement.ended || videoElement.videoWidth === 0) return;

    ppgCanvas.width = videoElement.videoWidth;
    ppgCanvas.height = videoElement.videoHeight;

    ppgCtx.drawImage(videoElement, 0, 0, ppgCanvas.width, ppgCanvas.height);

    // Forehead ROI (top center)
    const roiX = Math.floor(ppgCanvas.width * 0.4);
    const roiY = Math.floor(ppgCanvas.height * 0.1);
    const roiW = Math.floor(ppgCanvas.width * 0.2);
    const roiH = Math.floor(ppgCanvas.height * 0.15);

    const frameData = ppgCtx.getImageData(roiX, roiY, roiW, roiH);
    const data = frameData.data;

    let sumR = 0, sumG = 0, sumB = 0;
    const pixelCount = data.length / 4;

    for (let i = 0; i < data.length; i += 4) {
        sumR += data[i];
        sumG += data[i + 1];
        sumB += data[i + 2];
    }

    // Ambient-robust normalised green
    const total = sumR + sumG + sumB + 1e-6;
    const greenNorm = sumG / total;

    const now = Date.now();
    signalBuffer.push({ t: now, val: greenNorm });
    if (signalBuffer.length > BUFFER_SIZE) signalBuffer.shift();

    // Motion derivative
    if (lastGreenNorm !== null) {
        const diff = Math.abs(greenNorm - lastGreenNorm);
        ppgDerivBuffer.push(diff);
        if (ppgDerivBuffer.length > BUFFER_SIZE) ppgDerivBuffer.shift();
    }
    lastGreenNorm = greenNorm;

    if (
        signalBuffer.length === BUFFER_SIZE &&
        now - lastBpmCalcTime > BPM_UPDATE_INTERVAL
    ) {
        calculateBPM();
        lastBpmCalcTime = now;
    }
}

function calculateBPM() {
    const values = signalBuffer.map((s) => s.val);

    // Detrend with moving average
    const windowSize = 15;
    const cleanSignal = [];
    for (let i = 0; i < values.length; i++) {
        let sum = 0;
        let count = 0;
        for (
            let j = Math.max(0, i - windowSize);
            j < Math.min(values.length, i + windowSize);
            j++
        ) {
            sum += values[j];
            count++;
        }
        cleanSignal.push(values[i] - sum / count);
    }

    // Noise metrics
    const rawMean = values.reduce((a, b) => a + b, 0) / values.length;
    const rawVar = values.reduce((a, b) => a + Math.pow(b - rawMean, 2), 0) / values.length;
    const rawStd = Math.sqrt(rawVar);

    const mean =
        cleanSignal.reduce((a, b) => a + b, 0) / cleanSignal.length;
    const variance =
        cleanSignal.reduce((a, b) => a + Math.pow(b - mean, 2), 0) /
        cleanSignal.length;
    const std = Math.sqrt(variance);
    const threshold = mean + 0.4 * std;

    const peakTimes = [];
    const peakValues = [];
    for (let i = 1; i < cleanSignal.length - 1; i++) {
        if (
            cleanSignal[i] > cleanSignal[i - 1] &&
            cleanSignal[i] > cleanSignal[i + 1] &&
            cleanSignal[i] > threshold
        ) {
            peakTimes.push(signalBuffer[i].t);
            peakValues.push(cleanSignal[i]);
        }
    }

    if (peakTimes.length < 2) return;

    const intervals = [];
    for (let i = 1; i < peakTimes.length; i++) {
        intervals.push((peakTimes[i] - peakTimes[i - 1]) / 1000);
    }
    const avgInterval =
        intervals.reduce((a, b) => a + b, 0) / intervals.length;

    if (avgInterval <= 0) return;

    let bpm = 60 / avgInterval;
    bpm = Math.round(bpm);

    if (bpm < 40 || bpm > 200) return;

    lastBPMPulses.push(bpm);
    if (lastBPMPulses.length > 6) lastBPMPulses.shift();
    const avgBpm =
        lastBPMPulses.reduce((a, b) => a + b, 0) / lastBPMPulses.length;

    currentBpm = currentBpm * 0.7 + avgBpm * 0.3;
    bpmDisplay.innerText = Math.round(currentBpm);

    // --- HR QUALITY METRIC ---
    let peakMeanAmp = 0;
    if (peakValues.length > 0) {
        peakMeanAmp = peakValues.reduce((a, b) => a + b, 0) / peakValues.length;
    }
    const ampMetric = clamp01((peakMeanAmp / (std + 1e-6)) * 0.5);

    const intMean = avgInterval;
    const intVar = intervals.reduce((a, b) => a + Math.pow(b - intMean, 2), 0) / intervals.length;
    const intStd = Math.sqrt(intVar);
    let rhythmMetric = 1 - (intStd / (intMean + 1e-6));
    rhythmMetric = clamp01(rhythmMetric);

    let stdRatio = 0;
    if (rawStd > 1e-6) {
        stdRatio = clamp01(std / rawStd);
    }

    // Motion artifact metric from derivative
    let motionMetric = 1;
    if (ppgDerivBuffer.length > 0) {
        const derivMean = ppgDerivBuffer.reduce((a, b) => a + b, 0) / ppgDerivBuffer.length;
        // High derivative => lower motionMetric
        motionMetric = clamp01(1 - derivMean * 50); // scale factor tuned empirically
    }

    const quality = clamp01(
        0.35 * ampMetric +
        0.35 * rhythmMetric +
        0.10 * stdRatio +
        0.20 * motionMetric
    );
    hrQuality = quality;
    hrQualityDisplay.innerText = `HR Q: ${hrQuality.toFixed(2)}`;

    // UI dimming based on quality
    if (hrQuality < 0.5) {
        bpmDisplay.style.opacity = 0.4;
        bpmLabel.style.opacity = 0.4;
        hrQualityDisplay.style.opacity = 0.6;
        bpmDisplay.style.color = '#888888';
        bpmLabel.style.color = '#888888';
        hrQualityDisplay.style.color = '#888888';
    } else {
        bpmDisplay.style.opacity = 1.0;
        bpmLabel.style.opacity = 0.9;
        hrQualityDisplay.style.opacity = 0.9;
        bpmDisplay.style.color = '#ffffff';
        bpmLabel.style.color = '#00ff88';
        hrQualityDisplay.style.color = '#00ff88';
    }
}


/**
 * PART 4: RESPIRATION (CHEST ROI, MOTION-ROBUST + QUALITY)
 */
const respSignalBuffer = [];
const RESP_BUFFER_SIZE = 300; // ~10s at 30fps
let lastRespCalcTime = 0;
const RESP_UPDATE_INTERVAL = 1500;
let recentRespRates = [];
let currentRespRate = 0;
let respQuality = 0;
let lastCenterYRaw = null;

function processRespiration() {
    if (videoElement.paused || videoElement.ended || videoElement.videoWidth === 0) return;

    ppgCanvas.width = videoElement.videoWidth;
    ppgCanvas.height = videoElement.videoHeight;
    ppgCtx.drawImage(videoElement, 0, 0, ppgCanvas.width, ppgCanvas.height);

    // Chest ROI: central, lower-mid area
    const chestX = Math.floor(ppgCanvas.width * 0.35);
    const chestY = Math.floor(ppgCanvas.height * 0.45);
    const chestW = Math.floor(ppgCanvas.width * 0.30);
    const chestH = Math.floor(ppgCanvas.height * 0.40);

    const frameData = ppgCtx.getImageData(chestX, chestY, chestW, chestH);
    const data = frameData.data;

    const rows = chestH;
    const cols = chestW;
    const rowSums = new Array(rows).fill(0);

    for (let y = 0; y < rows; y++) {
        let rowSum = 0;
        for (let x = 0; x < cols; x++) {
            const idx = (y * cols + x) * 4;
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];
            const lum = 0.299 * r + 0.587 * g + 0.114 * b;
            rowSum += lum;
        }
        rowSums[y] = rowSum;
    }

    // Normalise row profile by frame mean to reduce non-uniform illumination changes
    let frameMean = rowSums.reduce((a, b) => a + b, 0) / (rows || 1);
    if (frameMean < 1e-6) frameMean = 1e-6;
    for (let y = 0; y < rows; y++) {
        rowSums[y] /= frameMean;
    }

    let total = 0;
    let weightedSum = 0;
    for (let y = 0; y < rows; y++) {
        total += rowSums[y];
        weightedSum += rowSums[y] * y;
    }

    let centerY = rows / 2;
    if (total > 0) {
        centerY = weightedSum / total;
    }

    // Soft motion clamp: if sudden global jump, limit it
    if (lastCenterYRaw !== null) {
        const deltaY = centerY - lastCenterYRaw;
        const maxJump = rows * 0.1; // allow up to 10% ROI height change per frame
        if (Math.abs(deltaY) > maxJump) {
            centerY = lastCenterYRaw + Math.sign(deltaY) * maxJump;
        }
    }
    lastCenterYRaw = centerY;

    const now = Date.now();
    respSignalBuffer.push({ t: now, val: centerY });
    if (respSignalBuffer.length > RESP_BUFFER_SIZE) respSignalBuffer.shift();

    if (
        respSignalBuffer.length === RESP_BUFFER_SIZE &&
        now - lastRespCalcTime > RESP_UPDATE_INTERVAL
    ) {
        calculateRespirationRate();
        lastRespCalcTime = now;
    }
}

function calculateRespirationRate() {
    const values = respSignalBuffer.map((s) => s.val);

    // Detrend with moving average
    const windowSize = 25;
    const cleanSignal = [];
    for (let i = 0; i < values.length; i++) {
        let sum = 0;
        let count = 0;
        for (
            let j = Math.max(0, i - windowSize);
            j < Math.min(values.length, i + windowSize);
            j++
        ) {
            sum += values[j];
            count++;
        }
        cleanSignal.push(values[i] - sum / count);
    }

    // Extra smoothing
    const smoothSignal = [];
    const smoothWin = 3;
    for (let i = 0; i < cleanSignal.length; i++) {
        let sum = 0;
        let count = 0;
        for (
            let j = Math.max(0, i - smoothWin);
            j <= Math.min(cleanSignal.length - 1, i + smoothWin);
            j++
        ) {
            sum += cleanSignal[j];
            count++;
        }
        smoothSignal.push(sum / count);
    }

    const mean =
        smoothSignal.reduce((a, b) => a + b, 0) / smoothSignal.length;
    const variance =
        smoothSignal.reduce((a, b) => a + Math.pow(b - mean, 2), 0) /
        smoothSignal.length;
    const std = Math.sqrt(variance);
    const threshold = mean + 0.3 * std;

    const peakTimes = [];
    const peakValues = [];
    for (let i = 1; i < smoothSignal.length - 1; i++) {
        if (
            smoothSignal[i] > smoothSignal[i - 1] &&
            smoothSignal[i] > smoothSignal[i + 1] &&
            smoothSignal[i] > threshold
        ) {
            peakTimes.push(respSignalBuffer[i].t);
            peakValues.push(smoothSignal[i]);
        }
    }

    if (peakTimes.length < 2) return;

    const intervals = [];
    for (let i = 1; i < peakTimes.length; i++) {
        intervals.push((peakTimes[i] - peakTimes[i - 1]) / 1000);
    }
    const avgInterval =
        intervals.reduce((a, b) => a + b, 0) / intervals.length;

    if (avgInterval <= 0) return;

    let brpm = 60 / avgInterval;

    if (brpm < 4 || brpm > 40) return;

    recentRespRates.push(brpm);
    if (recentRespRates.length > 6) recentRespRates.shift();
    const avgResp =
        recentRespRates.reduce((a, b) => a + b, 0) / recentRespRates.length;

    currentRespRate = currentRespRate * 0.7 + avgResp * 0.3;
    respDisplay.innerText = Math.round(currentRespRate);

    // --- RESP QUALITY METRIC ---
    let peakMeanAmp = 0;
    if (peakValues.length > 0) {
        peakMeanAmp = peakValues.reduce((a, b) => a + b, 0) / peakValues.length;
    }
    const ampMetric = clamp01((peakMeanAmp / (std + 1e-6)) * 0.5);

    const intMean = avgInterval;
    const intVar = intervals.reduce((a, b) => a + Math.pow(b - intMean, 2), 0) / intervals.length;
    const intStd = Math.sqrt(intVar);
    let rhythmMetric = 1 - (intStd / (intMean + 1e-6));
    rhythmMetric = clamp01(rhythmMetric);

    const cleanVar = cleanSignal.reduce((a, b) => a + Math.pow(b, 2), 0) / cleanSignal.length;
    const cleanStd = Math.sqrt(cleanVar);
    let smoothRatio = 0;
    if (cleanStd > 1e-6) {
        smoothRatio = clamp01(std / cleanStd);
    }

    const quality = clamp01(0.45 * ampMetric + 0.45 * rhythmMetric + 0.10 * smoothRatio);
    respQuality = quality;
    respQualityDisplay.innerText = `Resp Q: ${respQuality.toFixed(2)}`;

    // UI dimming based on quality
    if (respQuality < 0.5) {
        respDisplay.style.opacity = 0.4;
        respLabel.style.opacity = 0.4;
        respQualityDisplay.style.opacity = 0.6;
        respDisplay.style.color = '#888888';
        respLabel.style.color = '#888888';
        respQualityDisplay.style.color = '#888888';
    } else {
        respDisplay.style.opacity = 1.0;
        respLabel.style.opacity = 0.9;
        respQualityDisplay.style.opacity = 0.9;
        respDisplay.style.color = '#ffffff';
        respLabel.style.color = '#00ff88';
        respQualityDisplay.style.color = '#00ff88';
    }
}


/**
 * PART 5: CAMERA + HANDS + SIGNAL LOOPS
 */
const cameraUtils = new Camera(videoElement, {
    onFrame: async () => {
        await hands.send({ image: videoElement });

        // Respiration always on
        processRespiration();

        // HR only when heart is active (fist)
        if (heartActive) {
            processPPG();
        }
    },
    width: 640,
    height: 480
});
cameraUtils.start();


/**
 * PART 6: ANIMATION LOOP – HEART FORMATION + BEATING
 */
function animate() {
    requestAnimationFrame(animate);

    const now = performance.now();
    const delta = (now - lastFrameTime) / 1000;
    lastFrameTime = now;

    const positionsArray = geometry.attributes.position.array;

    const bpmForAnim = Math.max(40, Math.min(180, currentBpm || 60));
    const freq = bpmForAnim / 60;
    heartPhase += freq * 2 * Math.PI * delta;
    const beatScale = 1.0 + 0.18 * Math.sin(heartPhase);

    const dissipating =
        !handDetected && Date.now() - lastHandTime > 2000;

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;

        if (heartActive && !dissipating) {
            const targetX = heartBasePositions[i3] * beatScale;
            const targetY = heartBasePositions[i3 + 1] * beatScale;
            const targetZ = heartBasePositions[i3 + 2] * beatScale;

            positionsArray[i3]     += (targetX - positionsArray[i3]) * 0.2;
            positionsArray[i3 + 1] += (targetY - positionsArray[i3 + 1]) * 0.2;
            positionsArray[i3 + 2] += (targetZ - positionsArray[i3 + 2]) * 0.2;

            velocities[i3]     = (Math.random() - 0.5) * 0.4;
            velocities[i3 + 1] = (Math.random() - 0.5) * 0.4;
            velocities[i3 + 2] = (Math.random() - 0.5) * 0.4;
        } else {
            positionsArray[i3]     += velocities[i3];
            positionsArray[i3 + 1] += velocities[i3 + 1] - 0.01;
            positionsArray[i3 + 2] += velocities[i3 + 2];

            const r = 80;
            if (positionsArray[i3] > r || positionsArray[i3] < -r) {
                velocities[i3] *= -0.7;
            }
            if (positionsArray[i3 + 1] > r || positionsArray[i3 + 1] < -r) {
                velocities[i3 + 1] *= -0.7;
            }
            if (positionsArray[i3 + 2] > r || positionsArray[i3 + 2] < -r) {
                velocities[i3 + 2] *= -0.7;
            }

            velocities[i3]     += (Math.random() - 0.5) * 0.01;
            velocities[i3 + 1] += (Math.random() - 0.5) * 0.01;
            velocities[i3 + 2] += (Math.random() - 0.5) * 0.01;
        }
    }

    geometry.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
}

// Resize handling
window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
});

animate();
</script>
</body>
</html>
