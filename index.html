<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wilderness First Response: Interactive Story</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace; /* HUD style font */
            color: white;
        }

        #input_video {
            position: absolute;
            top: 0; left: 0; opacity: 0; pointer-events: none; z-index: -1;
        }

        /* Cinematic HUD Overlay */
        #hud-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 700px;
            z-index: 10;
            text-align: center;
        }

        #story-box {
            background: rgba(10, 20, 30, 0.85);
            border: 2px solid #00d2ff;
            border-radius: 4px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
            position: relative;
        }

        h1 {
            font-size: 1.1rem;
            color: #ff3333; /* Alert Red */
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid #ff3333;
            padding-bottom: 5px;
            display: inline-block;
        }

        #narrative {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #e0e0e0;
            margin-bottom: 20px;
            min-height: 60px;
        }

        #instruction {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00d2ff;
            background: rgba(0, 210, 255, 0.1);
            padding: 10px;
            border-radius: 4px;
        }

        /* Progress Bar for "Holding" the gesture */
        #progress-container {
            width: 100%;
            height: 6px;
            background: #333;
            margin-top: 15px;
            border-radius: 3px;
            overflow: hidden;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: #00d2ff;
            transition: width 0.1s linear;
        }

        #status-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            opacity: 0.8;
        }

        #loader {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #00d2ff; font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <div id="hud-container">
        <div id="story-box">
            <h1 id="chapter-title">INITIALIZING...</h1>
            <div id="status-icon">⚠️</div>
            <p id="narrative">Loading Neural Networks for Bio-Scan...</p>
            <div id="instruction">Please Wait</div>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>
    </div>

    <div id="loader">Booting Medical Interface...</div>
    <video id="input_video"></video>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        // --- 1. Story Engine Configuration ---
        
        // The narrative follows standard Emergency Response Protocols
        const STORY_STAGES = [
            {
                title: "Chapter 1: The Scene",
                narrative: "You arrive at the ravine. The hiker is lying unconscious at the bottom. The environment is chaotic, visibility is low. You need to secure the scene before approaching.",
                instruction: "Make a 'Open Palm' (High Five) to clear the fog and scan.",
                trigger: "open",
                shape: "cloud", // Random chaos
                color: [0.5, 0.5, 0.5] // Grey fog
            },
            {
                title: "Chapter 2: Massive Hemorrhage",
                narrative: "SCAN COMPLETE. Patient has a severe arterial bleed on the right leg. Bright red blood is spurting. Immediate action required. Tourniquet application necessary.",
                instruction: "Make a 'Fist' to apply pressure and tighten the tourniquet.",
                trigger: "fist",
                shape: "artery", // A pulsing cylinder
                color: [1.0, 0.0, 0.0] // Red blood
            },
            {
                title: "Chapter 3: Airway & Breathing",
                narrative: "Bleeding controlled. Checking Vitals. The patient is not breathing effectively. The chest is not rising. You suspect a tension pneumothorax or obstruction.",
                instruction: "Use 'Two Hands' (pull apart) to expand the lungs/chest cavity.",
                trigger: "two_hands",
                shape: "lungs", // Two spheres
                color: [0.0, 0.8, 1.0] // Cyan Oxygen
            },
            {
                title: "Chapter 4: Circulation (Pulse)",
                narrative: "Airway is clear. Breathing assisted. Now monitoring heart rate. Pulse is thready and weak. We need to stabilize cardiac rhythm and keep them warm.",
                instruction: "Make a 'Thumb Up' to stabilize the heart rate.",
                trigger: "thumb",
                shape: "heart", // Heart shape
                color: [1.0, 0.2, 0.5] // Pink/Red
            },
            {
                title: "Chapter 5: Fracture Stabilization",
                narrative: "Vitals stable. Secondary survey reveals a compound fracture of the tibia. We must splint the leg to prevent further damage during transport.",
                instruction: "Make a 'Peace Sign' to align the splint rigid supports.",
                trigger: "peace",
                shape: "splint", // A box/rectangular prism
                color: [1.0, 0.8, 0.0] // Orange/Warning
            },
            {
                title: "Chapter 6: Extraction",
                narrative: "Patient packaged. Search and Rescue helicopter is inbound. Signal the pilot for the long-line extraction.",
                instruction: "Point 'Index Finger' UP to guide the helicopter line.",
                trigger: "point",
                shape: "helix", // Double helix / Rotor
                color: [0.0, 1.0, 0.0] // Green Success
            },
            {
                title: "Mission Complete",
                narrative: "Patient successfully extracted to Level 1 Trauma Center. Good work, Medic.",
                instruction: "Rest. (Story Ended)",
                trigger: "done",
                shape: "sphere",
                color: [1.0, 1.0, 1.0]
            }
        ];

        let currentStageIndex = 0;
        let actionProgress = 0; // 0 to 100
        const PROGRESS_SPEED = 1.5; // How fast the bar fills when holding gesture
        const DECAY_SPEED = 2.0; // How fast it drops if you let go

        // --- 2. Three.js Visuals ---

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Particle Setup
        const PARTICLE_COUNT = 12000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        const sizes = new Float32Array(PARTICLE_COUNT);

        // Current color trackers for lerping
        const currentColor = new THREE.Color(0x555555);
        const targetColor = new THREE.Color(0x555555);

        // Generate Target Shapes
        const shapeTargets = {
            cloud: [],
            artery: [],
            lungs: [],
            heart: [],
            splint: [],
            helix: [],
            sphere: []
        };

        // Initialize Particles & Calculate Shapes
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            // Initial Pos
            positions[i * 3] = (Math.random() - 0.5) * 50;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 50;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 50;
            
            colors[i * 3] = 0.5;
            colors[i * 3 + 1] = 0.5;
            colors[i * 3 + 2] = 0.5;

            sizes[i] = Math.random() * 0.2;

            // 1. Cloud
            shapeTargets.cloud.push((Math.random()-0.5)*30, (Math.random()-0.5)*20, (Math.random()-0.5)*20);

            // 2. Artery (Cylinder with noise)
            const angle = Math.random() * Math.PI * 2;
            const r = 2 + Math.random() * 1; 
            const h = (i / PARTICLE_COUNT) * 20 - 10;
            shapeTargets.artery.push(r * Math.cos(angle), h, r * Math.sin(angle));

            // 3. Lungs (Two Ellipsoids)
            const side = (i % 2 === 0) ? 1 : -1;
            const u = Math.random() * Math.PI * 2;
            const v = Math.random() * Math.PI;
            const lr = 4;
            shapeTargets.lungs.push(
                (lr * Math.sin(v) * Math.cos(u)) + (side * 4), // Offset x
                (lr * 1.5 * Math.sin(v) * Math.sin(u)),        // Taller y
                (lr * Math.cos(v))
            );

            // 4. Heart (Math Formula)
            // x = 16sin^3(t), y = 13cos(t)-5cos(2t)-2cos(3t)-cos(4t)
            // We need 3D, so we rotate it or layer it. Let's do a thick layering.
            const t = Math.random() * Math.PI * 2;
            const zOff = (Math.random() - 0.5) * 4;
            const scale = 0.4;
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            shapeTargets.heart.push(hx * scale, hy * scale, zOff);

            // 5. Splint (Rectangular Prism)
            const sx = (Math.random() - 0.5) * 6;
            const sy = (Math.random() - 0.5) * 18;
            const sz = (Math.random() - 0.5) * 6;
            // Hollow it out slightly
            if(Math.random() > 0.5) {
                 shapeTargets.splint.push(sx, sy, sz); // Solid-ish
            } else {
                 // Define edges
                 shapeTargets.splint.push((Math.round(Math.random())*6)-3, sy, (Math.random()-0.5)*6);
            }

            // 6. Helix (Rotor/Line)
            const hIdx = i / PARTICLE_COUNT * 40; 
            const hAngle = i * 0.2;
            shapeTargets.helix.push(
                3 * Math.cos(hAngle),
                (i / PARTICLE_COUNT) * 30 - 15,
                3 * Math.sin(hAngle)
            );
            
            // 7. Sphere (End)
            const phi = Math.acos((Math.random() * 2) - 1);
            const theta = Math.random() * Math.PI * 2;
            const sr = 6;
            shapeTargets.sphere.push(
                sr * Math.sin(phi) * Math.cos(theta),
                sr * Math.sin(phi) * Math.sin(theta),
                sr * Math.cos(phi)
            );
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        // Custom Shader Material for glow effect
        const material = new THREE.PointsMaterial({
            size: 0.3,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.8
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);


        // --- 3. Animation & Logic Loop ---

        let time = 0;
        
        function updateStoryUI() {
            const stage = STORY_STAGES[currentStageIndex];
            document.getElementById('chapter-title').innerText = stage.title;
            document.getElementById('narrative').innerText = stage.narrative;
            document.getElementById('instruction').innerText = "ACTION: " + stage.instruction;
            
            // Update target color
            targetColor.setRGB(stage.color[0], stage.color[1], stage.color[2]);
        }

        function advanceStory() {
            if (currentStageIndex < STORY_STAGES.length - 1) {
                currentStageIndex++;
                actionProgress = 0;
                updateStoryUI();
                
                // Sound effect trigger could go here
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.05;

            const stageData = STORY_STAGES[currentStageIndex];
            const targetPos = shapeTargets[stageData.shape];
            const currentPos = geometry.attributes.position.array;
            const currentCols = geometry.attributes.color.array;

            // Lerp Color
            currentColor.lerp(targetColor, 0.05);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const ix = i * 3;
                
                // Position Morphing
                let tx = targetPos[ix];
                let ty = targetPos[ix+1];
                let tz = targetPos[ix+2];

                // Add "Life" animations based on stage
                if (stageData.shape === 'heart') {
                    // Pulse effect
                    const beat = 1 + Math.sin(time * 3) * 0.1; // heartbeat
                    tx *= beat; ty *= beat; tz *= beat;
                } else if (stageData.shape === 'artery') {
                    // Spurting flow effect
                    ty += Math.sin(time + i) * 0.5;
                } else if (stageData.shape === 'lungs') {
                    // Breathing effect
                    const breath = 1 + Math.sin(time) * 0.05;
                    tx *= breath; ty *= breath; tz *= breath;
                } else if (stageData.shape === 'helix') {
                    // Spin effect needs rotation matrix, simplified here by system rotation
                }

                // Move particles
                currentPos[ix] += (tx - currentPos[ix]) * 0.08;
                currentPos[ix+1] += (ty - currentPos[ix+1]) * 0.08;
                currentPos[ix+2] += (tz - currentPos[ix+2]) * 0.08;

                // Color Update
                currentCols[ix] = currentColor.r;
                currentCols[ix+1] = currentColor.g;
                currentCols[ix+2] = currentColor.b;
            }

            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;

            // Global Rotation
            if (stageData.shape === 'helix') {
                particleSystem.rotation.y -= 0.1; // Fast spin for chopper
            } else {
                particleSystem.rotation.y += 0.002; // Slow idle
            }

            // Progress Bar UI
            const bar = document.getElementById('progress-bar');
            bar.style.width = actionProgress + '%';

            // Visual feedback for holding gesture
            if (actionProgress > 0) {
                particleSystem.rotation.z = (Math.random() - 0.5) * (actionProgress / 500); // Shake slightly when working
            } else {
                particleSystem.rotation.z = 0;
            }

            renderer.render(scene, camera);
        }

        // Initialize UI
        updateStoryUI();
        animate();


        // --- 4. Computer Vision Logic ---
        
        function detectGesture(landmarks, handedness) {
            // Simplified Gesture detection logic
            const wrist = landmarks[0];
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const middleTip = landmarks[12];
            const ringTip = landmarks[16];
            const pinkyTip = landmarks[20];

            const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);
            const isExtended = (tip, pip) => dist(landmarks[tip], wrist) > dist(landmarks[pip], wrist);

            const iUp = isExtended(8, 6);
            const mUp = isExtended(12, 10);
            const rUp = isExtended(16, 14);
            const pUp = isExtended(20, 18);
            const tUp = isExtended(4, 2);

            // FIST
            if (!iUp && !mUp && !rUp && !pUp) return 'fist';
            // OPEN PALM
            if (iUp && mUp && rUp && pUp && tUp) return 'open';
            // POINT
            if (iUp && !mUp && !rUp && !pUp) return 'point';
            // THUMB
            if (tUp && !iUp && !mUp && !rUp && !pUp) return 'thumb';
            // PEACE
            if (iUp && mUp && !rUp && !pUp) return 'peace';
            
            return 'neutral';
        }

        const videoElement = document.getElementById('input_video');
        const loader = document.getElementById('loader');

        function onResults(results) {
            loader.style.display = 'none';
            
            const stage = STORY_STAGES[currentStageIndex];
            let detectedAction = null;

            // 1. Detect Dual Hands first (Special case for Breathing stage)
            if (results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
                const hand1 = results.multiHandLandmarks[0][9];
                const hand2 = results.multiHandLandmarks[1][9];
                const dist = Math.hypot(hand1.x - hand2.x, hand1.y - hand2.y);
                
                // If hands are apart and moving, trigger "two_hands"
                if (dist > 0.3) detectedAction = 'two_hands';
            }
            
            // 2. If no dual hand action, check single hand gestures
            if (!detectedAction && results.multiHandLandmarks.length > 0) {
                detectedAction = detectGesture(results.multiHandLandmarks[0]);
            }

            // 3. Game Logic: Check if detected matches required
            if (detectedAction === stage.trigger) {
                // Increase progress
                actionProgress += PROGRESS_SPEED;
                if (actionProgress >= 100) {
                    advanceStory();
                }
            } else {
                // Decay progress if they stop
                if (actionProgress > 0) actionProgress -= DECAY_SPEED;
                if (actionProgress < 0) actionProgress = 0;
            }
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        const cameraFeed = new Camera(videoElement, {
            onFrame: async () => await hands.send({image: videoElement}),
            width: 640, height: 480
        });
        cameraFeed.start();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
