<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Curiosity Field (Gestures)</title>
  <style>
    html, body { margin:0; padding:0; overflow:hidden; background:#05060a; }
    #hud {
      position:fixed; left:16px; top:16px; color:rgba(255,255,255,.85);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      letter-spacing: .2px; font-size: 13px;
      background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px; padding: 12px 14px; backdrop-filter: blur(10px);
      user-select:none; pointer-events:none;
      max-width: 360px;
    }
    #hud b { color:#fff; }
    #badge {
      display:inline-block; padding:2px 8px; border-radius: 999px;
      border:1px solid rgba(255,255,255,.18); margin-left:8px;
      font-size: 12px; opacity: .9;
    }
    #hint { opacity:.75; margin-top:8px; line-height: 1.35; }
    #corner {
      position:fixed; right:16px; top:16px; text-align:right;
      font-family: ui-sans-serif, system-ui; color: rgba(255,255,255,.85);
      background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px; padding: 10px 12px; backdrop-filter: blur(10px);
      user-select:none; pointer-events:none;
    }
    #corner .k { opacity:.7; font-size: 12px; }
    #corner .v { font-size: 18px; font-weight: 700; }
    #video {
      position:fixed; left:16px; bottom:16px; width: 160px; height: 120px;
      border-radius: 12px; border:1px solid rgba(255,255,255,.12);
      opacity:.0; pointer-events:none; /* set to .9 to debug */
    }
    canvas { display:block; }
  </style>
</head>
<body>
  <div id="hud">
    <div><b>Curiosity Field</b><span id="badge">Explore</span></div>
    <div id="hint">
      Use your hands. There is no “right” way — only patterns you can discover.
      <br/>Right hand acts. Left hand modifies.
    </div>
  </div>

  <div id="corner">
    <div class="k">coherence</div>
    <div class="v" id="coh">0.00</div>
    <div class="k" style="margin-top:8px;">phase</div>
    <div class="v" id="ph">A</div>
  </div>

  <video id="video" playsinline></video>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.min.js"></script>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    // =========================
    // 0) Helpers
    // =========================
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const now = () => performance.now();

    function rotate90(vx, vy) { return [-vy, vx]; }

    // Gesture utilities (landmarks are normalized [0..1])
    function dist2(a, b) {
      const dx = a.x - b.x, dy = a.y - b.y;
      return dx*dx + dy*dy;
    }

    function fingerExtended(lm, tipIdx, pipIdx) {
      // Rough heuristic: fingertip higher (smaller y) than PIP in image coordinates.
      return lm[tipIdx].y < lm[pipIdx].y;
    }

    function classifyGesture(lm) {
      // Landmarks indices (MediaPipe Hands):
      // 4 thumb_tip, 8 index_tip, 12 middle_tip, 16 ring_tip, 20 pinky_tip
      // PIP joints: 6, 10, 14, 18 (thumb uses different; we'll use pinch distance for thumb)
      const idxExt = fingerExtended(lm, 8, 6);
      const midExt = fingerExtended(lm, 12, 10);
      const ringExt = fingerExtended(lm, 16, 14);
      const pinkExt = fingerExtended(lm, 20, 18);

      const pinch = dist2(lm[4], lm[8]) < 0.0022; // tuned threshold

      // Point: index extended, others not
      const point = idxExt && !(midExt || ringExt || pinkExt);

      // Open palm: all (or most) extended
      const open = idxExt && midExt && ringExt && pinkExt && !pinch;

      // Fist: none extended (or very few), and not pinch
      const fist = !(idxExt || midExt || ringExt || pinkExt) && !pinch;

      if (pinch) return "PINCH";
      if (open)  return "OPEN";
      if (point) return "POINT";
      if (fist)  return "FIST";
      return "UNKNOWN";
    }

    // Smooth a scalar over time
    function smoothStep(prev, next, a=0.18) { return lerp(prev, next, a); }

    // =========================
    // 1) Three.js scene
    // =========================
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x05060a, 2, 8);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.01, 50);
    camera.position.set(0, 0, 4.2);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Subtle background light
    const light = new THREE.PointLight(0xffffff, 0.6, 50);
    light.position.set(2, 2, 4);
    scene.add(light);

    // =========================
    // 2) Particle Field
    // =========================
    const N = 1200; // complexity + novelty
    const positions = new Float32Array(N * 3);
    const colors = new Float32Array(N * 3);
    const velocities = new Float32Array(N * 3);
    const phase = new Float32Array(N); // hidden scalar [-1..1]

    function randn() {
      // Box-Muller
      let u=0, v=0;
      while(u===0) u=Math.random();
      while(v===0) v=Math.random();
      return Math.sqrt(-2.0*Math.log(u))*Math.cos(2.0*Math.PI*v);
    }

    for (let i=0;i<N;i++){
      const r = 1.25 * Math.sqrt(Math.random());
      const a = Math.random()*Math.PI*2;
      positions[3*i+0] = r*Math.cos(a) + 0.05*randn();
      positions[3*i+1] = r*Math.sin(a) + 0.05*randn();
      positions[3*i+2] = 0.25*randn();

      velocities[3*i+0] = 0.02*randn();
      velocities[3*i+1] = 0.02*randn();
      velocities[3*i+2] = 0.02*randn();

      phase[i] = (Math.random()*2-1);

      // init color (will be overwritten by coherence shading)
      colors[3*i+0] = 0.7;
      colors[3*i+1] = 0.8;
      colors[3*i+2] = 1.0;
    }

    const geom = new THREE.BufferGeometry();
    geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geom.setAttribute("color", new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.PointsMaterial({
      size: 0.018,
      vertexColors: true,
      transparent: true,
      opacity: 0.95,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const points = new THREE.Points(geom, mat);
    scene.add(points);

    // =========================
    // 3) Puzzle phases & parameters
    // =========================
    const t0 = now();
    const SHIFT_AT_MS = 60000; // 60s
    const END_AT_MS = 90000;   // 90s

    // base physics parameters
    let alpha = 1.35;     // radial strength
    let beta  = 0.95;     // swirl strength
    let gamma = 0.22;     // neighbor-like alignment strength (approx)
    let noise = 0.018;    // brownian
    let damping = 0.985;

    // "regime" variable: pinch attract vs repel
    let pinchSign = +1; // flips at shift
    let swirlSign = +1; // constant in v1

    // Left-hand modifiers (context)
    let modCoupling = 1.0;
    let modRadius   = 1.0;
    let modAxisLock = 0.0;

    // =========================
    // 4) Hand tracking (MediaPipe)
    // =========================
    const videoEl = document.getElementById("video");
    const badgeEl = document.getElementById("badge");
    const cohEl = document.getElementById("coh");
    const phEl = document.getElementById("ph");

    // Hand state (smoothed)
    const handState = {
      right: { present:false, x:0, y:0, vx:0, vy:0, gesture:"UNKNOWN", gSmooth:"UNKNOWN" },
      left:  { present:false, x:0, y:0, vx:0, vy:0, gesture:"UNKNOWN", gSmooth:"UNKNOWN" },
    };

    function updateHand(which, lm, handednessLabel) {
      // Use landmark 9 (middle MCP) as stable palm center-ish
      const cx = lm[9].x;
      const cy = lm[9].y;

      // Convert normalized image coords -> world-ish coords
      const wx = (cx - 0.5) * 3.2;
      const wy = -(cy - 0.5) * 2.0;

      const hs = handState[which];
      hs.present = true;
      hs.vx = smoothStep(hs.vx, (wx - hs.x), 0.25);
      hs.vy = smoothStep(hs.vy, (wy - hs.y), 0.25);
      hs.x = smoothStep(hs.x, wx, 0.22);
      hs.y = smoothStep(hs.y, wy, 0.22);

      const g = classifyGesture(lm);
      hs.gesture = g;

      // gesture smoothing: require stability for a few frames
      if (hs._lastG === g) {
        hs._gCount = (hs._gCount || 0) + 1;
      } else {
        hs._lastG = g;
        hs._gCount = 0;
      }
      hs.gSmooth = (hs._gCount > 3) ? g : hs.gSmooth; // simple debounce
    }

    function clearHands() {
      handState.right.present = false;
      handState.left.present  = false;
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      clearHands();
      if (!results.multiHandLandmarks || !results.multiHandedness) return;

      for (let i=0;i<results.multiHandLandmarks.length;i++){
        const lm = results.multiHandLandmarks[i];
        const handed = results.multiHandedness[i].label; // "Left"/"Right" from camera perspective
        // For user experience, we treat label as the user's actual hand; it’s usually correct.
        if (handed === "Right") updateHand("right", lm, handed);
        if (handed === "Left")  updateHand("left",  lm, handed);
      }
    });

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
      videoEl.srcObject = stream;
      await videoEl.play();

      const cam = new Camera(videoEl, {
        onFrame: async () => { await hands.send({ image: videoEl }); },
        width: 640,
        height: 480
      });
      cam.start();
    }

    startCamera().catch(err => {
      badgeEl.textContent = "Camera blocked";
      document.getElementById("hint").innerHTML =
        "Camera permission is needed for gesture control.<br/>Enable it and reload.";
      console.error(err);
    });

    // =========================
    // 5) Logging for CI
    // =========================
    const logs = {
      // sampled at ~15Hz
      t: [],
      coherence: [],
      speed: [],
      rightGesture: [],
      leftGesture: [],
      rightX: [],
      rightY: [],
      leftX: [],
      leftY: [],
      phase: [],
    };

    // Gesture → physics for right hand
    function rightForces(g, x, y, vx, vy, timeMs) {
      // returns {radial, swirl, pulse, beam}
      // intensity shaped by speed of movement a bit
      const sp = Math.sqrt(vx*vx + vy*vy);
      const intensity = clamp(0.6 + sp*2.0, 0.6, 1.8);

      // base
      let radial = 0, swirl = 0, pulse = 0, beam = 0;

      if (g === "PINCH") radial = 1.0 * intensity; // attract/repel (sign may flip)
      else if (g === "OPEN") swirl = 1.0 * intensity;
      else if (g === "FIST") pulse = 1.0 * intensity;
      else if (g === "POINT") beam = 1.0 * intensity;

      return { radial, swirl, pulse, beam };
    }

    // Left hand modifies context
    function applyLeftModifiers(g) {
      // defaults
      modCoupling = 1.0;
      modRadius = 1.0;
      modAxisLock = 0.0;

      if (g === "OPEN") modCoupling = 1.6;       // easier coherence
      else if (g === "FIST") modCoupling = 0.7;  // harder
      else if (g === "PINCH") modRadius = 0.65;  // precision
      else if (g === "POINT") modAxisLock = 1.0; // symmetry pressure
    }

    // =========================
    // 6) Physics update
    // =========================
    function computeCoherence() {
      let mx=0, my=0, mz=0;
      for (let i=0;i<N;i++){
        const vx = velocities[3*i+0], vy = velocities[3*i+1], vz = velocities[3*i+2];
        const mag = Math.sqrt(vx*vx+vy*vy+vz*vz) + 1e-6;
        mx += vx/mag; my += vy/mag; mz += vz/mag;
      }
      mx/=N; my/=N; mz/=N;
      return Math.sqrt(mx*mx+my*my+mz*mz);
    }

    function meanSpeed() {
      let s=0;
      for (let i=0;i<N;i++){
        const vx = velocities[3*i+0], vy = velocities[3*i+1], vz = velocities[3*i+2];
        s += Math.sqrt(vx*vx+vy*vy+vz*vz);
      }
      return s/N;
    }

    // Approx neighbor alignment (cheap): align to global mean velocity direction (works surprisingly well visually)
    function applyGlobalAlignment(gain) {
      let mvx=0,mvy=0,mvz=0;
      for (let i=0;i<N;i++){
        mvx += velocities[3*i+0];
        mvy += velocities[3*i+1];
        mvz += velocities[3*i+2];
      }
      mvx/=N; mvy/=N; mvz/=N;

      for (let i=0;i<N;i++){
        velocities[3*i+0] += gain * (mvx - velocities[3*i+0]);
        velocities[3*i+1] += gain * (mvy - velocities[3*i+1]);
        velocities[3*i+2] += gain * (mvz - velocities[3*i+2]);
      }
    }

    function updateColorsFromCoherence(coh) {
      // Map coherence to a “cleaner” palette without being an obvious score bar.
      // low coh: cooler/dimmer; high coh: brighter/whiter
      const brightness = clamp(0.35 + coh*0.85, 0.25, 1.0);
      for (let i=0;i<N;i++){
        const p = (phase[i] * 0.5 + 0.5); // 0..1
        // base tint slightly varies by phase scalar so it feels alive
        const r = lerp(0.20, 0.95, brightness) * lerp(0.6, 1.0, p);
        const g = lerp(0.35, 0.98, brightness) * lerp(0.7, 1.0, 1.0-p*0.35);
        const b = lerp(0.70, 1.00, brightness);
        colors[3*i+0] = r;
        colors[3*i+1] = g;
        colors[3*i+2] = b;
      }
      geom.attributes.color.needsUpdate = true;
    }

    function enforceBounds(i) {
      // soft spherical bounds
      const x = positions[3*i+0], y = positions[3*i+1], z = positions[3*i+2];
      const r = Math.sqrt(x*x + y*y + z*z);
      const R = 1.9;
      if (r > R) {
        const k = (r - R) * 0.015;
        velocities[3*i+0] -= k * (x/r);
        velocities[3*i+1] -= k * (y/r);
        velocities[3*i+2] -= k * (z/r);
      }
    }

    // =========================
    // 7) CI computation (v1)
    // =========================
    function computeCI() {
      // Normalize helper
      const norm01 = (x, a, b) => clamp((x - a) / (b - a + 1e-9), 0, 1);

      const T = logs.t.length;
      if (T < 10) return null;

      // Split windows around shift
      const shiftT = SHIFT_AT_MS;
      let pre = [], post = [];
      for (let i=0;i<T;i++){
        if (logs.t[i] < shiftT) pre.push(i);
        else post.push(i);
      }
      const mean = (arr, f) => arr.reduce((s,i)=>s+f(i),0)/(arr.length||1);
      const slope = (arr, f) => {
        // simple linear regression slope vs time
        const n = arr.length||1;
        const mt = mean(arr, i=>logs.t[i]);
        const my = mean(arr, i=>f(i));
        let num=0, den=0;
        for (const i of arr){
          const dt = logs.t[i]-mt;
          num += dt*(f(i)-my);
          den += dt*dt;
        }
        return num/(den+1e-9);
      };

      const cohMeanPre = mean(pre, i=>logs.coherence[i]);
      const cohMeanPost = mean(post, i=>logs.coherence[i]);

      // Exploration proxy: gesture diversity + movement coverage
      const uniqGest = (arr) => new Set(arr).size;
      const rightGuniq = uniqGest(logs.rightGesture.filter(g=>g!=="UNKNOWN"));
      const leftGuniq  = uniqGest(logs.leftGesture.filter(g=>g!=="UNKNOWN"));
      const E = norm01((rightGuniq + 0.7*leftGuniq), 1.0, 6.0);

      // Model formation proxy: coherence slope in early phase (should rise)
      const early = pre.filter(i => logs.t[i] < 35000);
      const cohSlopeEarly = slope(early, i=>logs.coherence[i]); // per ms
      const M = norm01(cohSlopeEarly * 100000, -0.2, 1.2); // scale

      // Persistence proxy: interaction presence after dips post-shift
      const postCohSlope = slope(post, i=>logs.coherence[i]);
      const P = norm01(postCohSlope * 100000, -0.5, 1.1);

      // Adaptation latency: time from shift to first sustained strategy change
      // Heuristic: when right gesture differs from pre-shift dominant gesture for >= 1s
      function dominantGesture(indices) {
        const counts = new Map();
        for (const i of indices) {
          const g = logs.rightGesture[i];
          if (g==="UNKNOWN") continue;
          counts.set(g, (counts.get(g)||0)+1);
        }
        let best="UNKNOWN", bestC=0;
        for (const [g,c] of counts.entries()){
          if (c>bestC){bestC=c; best=g;}
        }
        return best;
      }
      const domPre = dominantGesture(pre.slice(-Math.min(60, pre.length))); // last ~4s
      let adaptMs = 99999;
      for (let i=0;i<T;i++){
        if (logs.t[i] < shiftT) continue;
        const window = [];
        for (let j=i;j<T && logs.t[j] < logs.t[i] + 1000;j++) window.push(j);
        if (window.length < 8) continue;
        // if most gestures in window are not domPre, mark as change
        let diff=0, total=0;
        for (const j of window){
          const g = logs.rightGesture[j];
          if (g==="UNKNOWN") continue;
          total++;
          if (g !== domPre) diff++;
        }
        if (total >= 6 && diff/total >= 0.75) { adaptMs = logs.t[i]-shiftT; break; }
      }
      const A = 1.0 - norm01(adaptMs, 800, 12000); // faster = higher

      // Depth/play: after coherence recovers, do they explore with control?
      // proxy: if post coherence rises AND gesture diversity remains >1
      const postGuniq = uniqGest(logs.rightGesture.filter((g,idx)=>logs.t[idx]>shiftT+8000 && g!=="UNKNOWN"));
      const D = norm01((cohMeanPost*0.8 + postGuniq*0.12), 0.15, 1.05);

      // Vector + scalar summary
      const vec = { E:+E.toFixed(3), M:+M.toFixed(3), P:+P.toFixed(3), A:+A.toFixed(3), D:+D.toFixed(3) };
      const mag = Math.sqrt(E*E+M*M+P*P+A*A+D*D);
      return { vec, mag:+mag.toFixed(3), domPre, adaptMs: Math.round(adaptMs) };
    }

    // =========================
    // 8) Animation loop
    // =========================
    let last = now();
    let lastLog = now();
    let shifted = false;

    function animate() {
      requestAnimationFrame(animate);

      const t = now() - t0;
      const dt = Math.min(0.033, (now() - last)/1000);
      last = now();

      // Phase selection for display
      let phaseLabel = "A";
      if (t > 35000 && t <= SHIFT_AT_MS) phaseLabel = "B";
      if (t > SHIFT_AT_MS) phaseLabel = "C";
      phEl.textContent = phaseLabel;

      // silent shift
      if (!shifted && t >= SHIFT_AT_MS) {
        shifted = true;
        pinchSign *= -1; // THE PHASE SHIFT: pinch flips attract<->repel
        badgeEl.textContent = "Explore";
      }

      // end
      if (t > END_AT_MS) {
        const ci = computeCI();
        badgeEl.textContent = "Done";
        if (ci) {
          console.log("Curiosity Index (v1):", ci);
          document.getElementById("hint").innerHTML =
            "Done. (CI logged to console.)<br/>You can now refresh to try again.";
        }
        // freeze gently
        damping = 0.992;
        noise = 0.004;
      } else {
        // subtle badge updates
        badgeEl.textContent = (t < 2500) ? "Explore" : (shifted ? "Adapt" : "Discover");
      }

      // Left modifiers
      const leftG = handState.left.present ? handState.left.gSmooth : "UNKNOWN";
      applyLeftModifiers(leftG);

      // Right actuation
      const rightG = handState.right.present ? handState.right.gSmooth : "UNKNOWN";
      const rx = handState.right.x, ry = handState.right.y;
      const rvx = handState.right.vx, rvy = handState.right.vy;
      const forces = handState.right.present ? rightForces(rightG, rx, ry, rvx, rvy, t) : {radial:0,swirl:0,pulse:0,beam:0};

      // Phase B tightens coherence (increases gamma, reduces noise)
      const phaseGamma = gamma * modCoupling * (phaseLabel==="B" ? 1.35 : 1.0) * (phaseLabel==="C" ? 1.1 : 1.0);
      const phaseNoise = noise * (phaseLabel==="B" ? 0.85 : 1.0) * (phaseLabel==="C" ? 0.95 : 1.0);

      // If left hand points, add axis-lock pressure (symmetry constraint)
      const axisLock = modAxisLock;

      // Apply global alignment (cheap neighbor coupling approximation)
      applyGlobalAlignment(phaseGamma * dt);

      // Per-particle physics
      const R0 = 0.55 * modRadius; // interaction radius scale
      const k = 1.35; // falloff
      const eps = 0.03;

      for (let i=0;i<N;i++){
        const ix = 3*i+0, iy = 3*i+1, iz = 3*i+2;

        let x = positions[ix], y = positions[iy], z = positions[iz];
        let vx = velocities[ix], vy = velocities[iy], vz = velocities[iz];

        // Brownian noise (controlled)
        vx += phaseNoise * randn() * dt;
        vy += phaseNoise * randn() * dt;
        vz += (phaseNoise*0.6) * randn() * dt;

        // Right-hand interaction
        if (handState.right.present) {
          const dx = rx - x;
          const dy = ry - y;
          const d2 = dx*dx + dy*dy;
          const d = Math.sqrt(d2) + 1e-6;

          // Only act within soft radius
          const rGate = Math.exp(-d2 / (R0*R0 + 1e-6));

          const nx = dx / (d + 1e-6);
          const ny = dy / (d + 1e-6);
          const inv = 1.0 / (Math.pow(d + eps, k));

          // Radial (pinch)
          if (forces.radial > 0) {
            const sgn = pinchSign;
            const f = alpha * forces.radial * sgn * inv * rGate;
            vx += f * nx * dt;
            vy += f * ny * dt;
          }

          // Swirl (open palm)
          if (forces.swirl > 0) {
            const [tx, ty] = rotate90(nx, ny);
            const f = beta * forces.swirl * swirlSign * inv * rGate;
            vx += f * tx * dt;
            vy += f * ty * dt;
          }

          // Pulse (fist): radial impulse that tends to “reset” or disrupt
          if (forces.pulse > 0) {
            const f = 0.8 * forces.pulse * inv * rGate;
            vx += f * (-nx) * dt;
            vy += f * (-ny) * dt;
          }

          // Beam (point): shear/align along motion direction of the hand
          if (forces.beam > 0) {
            const hvx = clamp(rvx, -0.2, 0.2);
            const hvy = clamp(rvy, -0.2, 0.2);
            const f = 1.1 * forces.beam * inv * rGate;
            vx += f * hvx * dt;
            vy += f * hvy * dt;
          }
        }

        // Axis lock (left point): encourage symmetry about y-axis
        if (axisLock > 0) {
          vx += (-x) * 0.08 * axisLock * dt;
        }

        // Damping
        vx *= damping;
        vy *= damping;
        vz *= damping;

        // Integrate
        x += vx;
        y += vy;
        z += vz;

        positions[ix] = x; positions[iy] = y; positions[iz] = z;
        velocities[ix] = vx; velocities[iy] = vy; velocities[iz] = vz;

        enforceBounds(i);

        // Slowly drift hidden phase scalar (keeps visual alive)
        phase[i] = clamp(phase[i] + 0.002*randn()*dt, -1, 1);
      }

      geom.attributes.position.needsUpdate = true;

      // Coherence & visuals
      const coh = computeCoherence();
      cohEl.textContent = coh.toFixed(2);
      updateColorsFromCoherence(coh);

      // Log at ~15Hz
      const tNow = now();
      if (tNow - lastLog > 66) {
        lastLog = tNow;
        logs.t.push(t);
        logs.coherence.push(coh);
        logs.speed.push(meanSpeed());
        logs.rightGesture.push(handState.right.present ? handState.right.gSmooth : "NONE");
        logs.leftGesture.push(handState.left.present ? handState.left.gSmooth : "NONE");
        logs.rightX.push(handState.right.present ? handState.right.x : 0);
        logs.rightY.push(handState.right.present ? handState.right.y : 0);
        logs.leftX.push(handState.left.present ? handState.left.x : 0);
        logs.leftY.push(handState.left.present ? handState.left.y : 0);
        logs.phase.push(phaseLabel);
      }

      // Camera orbit micro motion for depth
      const wobble = 0.06;
      camera.position.x = Math.sin((t*0.00025)) * wobble;
      camera.position.y = Math.cos((t*0.00022)) * wobble * 0.6;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
