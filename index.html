<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Curiosity Field (v2.3 — Fast Response + Hand Landmark Debug + CI Particle Text)</title>
  <style>
    html, body { margin:0; padding:0; overflow:hidden; background:#05060a; }
    canvas { display:block; }

    #hud {
      position:fixed; left:16px; top:16px; color:rgba(255,255,255,.85);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      letter-spacing: .2px; font-size: 13px;
      background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px; padding: 12px 14px; backdrop-filter: blur(10px);
      user-select:none; pointer-events:none; max-width: 480px;
      z-index: 5;
    }
    #hud b { color:#fff; }
    #badge {
      display:inline-block; padding:2px 8px; border-radius: 999px;
      border:1px solid rgba(255,255,255,.18); margin-left:8px;
      font-size: 12px; opacity: .9;
    }
    #hint { opacity:.75; margin-top:8px; line-height: 1.35; }

    #corner {
      position:fixed; right:16px; top:16px; text-align:right;
      font-family: ui-sans-serif, system-ui; color: rgba(255,255,255,.85);
      background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px; padding: 10px 12px; backdrop-filter: blur(10px);
      user-select:none; pointer-events:none;
      min-width: 170px;
      z-index: 5;
    }
    #corner .k { opacity:.7; font-size: 12px; }
    #corner .v { font-size: 18px; font-weight: 700; }

    /* Webcam debug box bottom-right */
    #camBox{
      position:fixed;
      right:16px;
      bottom:16px;
      width: 320px;
      height: 240px;
      border-radius: 14px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    #video, #overlay{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
    }
    #overlay{ pointer-events:none; }

    /* Tiny label over cam */
    #camLabel{
      position:absolute;
      left:10px; top:10px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.14);
      font-family: ui-sans-serif, system-ui;
      font-size: 12px;
      color: rgba(255,255,255,.85);
      z-index: 11;
      user-select:none;
      pointer-events:none;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div><b>Curiosity Field</b><span id="badge">Explore</span></div>
    <div id="hint">
      Fast-response continuous gesture grammar + seeded rule family.
      <br/>Bottom-right: webcam with hand landmarks (debug).
      <br/>End: particles write your CI score.
    </div>
  </div>

  <div id="corner">
    <div class="k">coherence</div>
    <div class="v" id="coh">0.00</div>

    <div class="k" style="margin-top:8px;">phase</div>
    <div class="v" id="ph">A</div>

    <div class="k" style="margin-top:8px;">family</div>
    <div class="v" id="fam">—</div>

    <div class="k" style="margin-top:8px;">filaments</div>
    <div class="v" id="fil">0</div>
  </div>

  <div id="camBox">
    <div id="camLabel">Hands Debug</div>
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.min.js"></script>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    // ============================================================
    // 0) Helpers
    // ============================================================
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp  = (a, b, t) => a + (b - a) * t;
    const now   = () => performance.now();
    const rotate90 = (vx, vy) => [-vy, vx];

    function xmur3(str) {
      let h = 1779033703 ^ str.length;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = (h << 13) | (h >>> 19);
      }
      return function() {
        h = Math.imul(h ^ (h >>> 16), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        h ^= h >>> 16;
        return h >>> 0;
      };
    }
    function sfc32(a, b, c, d) {
      return function() {
        a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
        let t = (a + b) | 0;
        a = b ^ (b >>> 9);
        b = (c + (c << 3)) | 0;
        c = (c << 21) | (c >>> 11);
        d = (d + 1) | 0;
        t = (t + d) | 0;
        c = (c + t) | 0;
        return (t >>> 0) / 4294967296;
      };
    }

    // Per-run DNA
    const runSalt = `${Date.now()}-${Math.random()}-${navigator.userAgent}`;
    const seedGen = xmur3(runSalt);
    const rand = sfc32(seedGen(), seedGen(), seedGen(), seedGen());
    const randf = (a,b) => a + (b-a)*rand();
    function randn() {
      let u=0, v=0;
      while(u===0) u=rand();
      while(v===0) v=rand();
      return Math.sqrt(-2.0*Math.log(u))*Math.cos(2.0*Math.PI*v);
    }
    function smoothStep(prev, next, a=0.18) { return lerp(prev, next, a); }

    // ============================================================
    // 1) Scene
    // ============================================================
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x05060a, 2, 9);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.01, 60);
    camera.position.set(0, 0, 4.2);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const light = new THREE.PointLight(0xffffff, 0.65, 80);
    light.position.set(2, 2, 4);
    scene.add(light);

    // ============================================================
    // 2) Particle Field (performance tuned)
    // ============================================================
    const N = 1100; // was 1700 — faster & snappier
    const positions = new Float32Array(N * 3);
    const colors    = new Float32Array(N * 3);
    const velocities= new Float32Array(N * 3);
    const phase     = new Float32Array(N);

    for (let i=0;i<N;i++){
      const r = 1.35 * Math.sqrt(rand());
      const a = rand()*Math.PI*2;
      positions[3*i+0] = r*Math.cos(a) + 0.06*randn();
      positions[3*i+1] = r*Math.sin(a) + 0.06*randn();
      positions[3*i+2] = 0.30*randn();

      velocities[3*i+0] = 0.02*randn();
      velocities[3*i+1] = 0.02*randn();
      velocities[3*i+2] = 0.02*randn();

      phase[i] = (rand()*2-1);

      colors[3*i+0] = 0.7;
      colors[3*i+1] = 0.8;
      colors[3*i+2] = 1.0;
    }

    const geom = new THREE.BufferGeometry();
    geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geom.setAttribute("color", new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.PointsMaterial({
      size: 0.017,
      vertexColors: true,
      transparent: true,
      opacity: 0.95,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const points = new THREE.Points(geom, mat);
    scene.add(points);

    // ============================================================
    // 3) Filaments (reduced for speed)
    // ============================================================
    const FIL_MAX = 420; // was 760 — big perf win
    const filPos = new Float32Array(FIL_MAX * 2 * 3);
    const filGeom = new THREE.BufferGeometry();
    filGeom.setAttribute("position", new THREE.BufferAttribute(filPos, 3));

    const filMat = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.0,
      blending: THREE.AdditiveBlending
    });

    const filLines = new THREE.LineSegments(filGeom, filMat);
    scene.add(filLines);

    const filEl = document.getElementById("fil");
    function updateFilaments(coh, strength01) {
      const want = Math.floor(lerp(0, FIL_MAX, strength01));
      filEl.textContent = String(want);

      let w = 0;
      for (let s=0; s<want; s++){
        const i = Math.floor(rand()*N);
        const j = (i + 1 + Math.floor(rand()*70)) % N;

        const ix = 3*i, jx = 3*j;
        const x1 = positions[ix],   y1 = positions[ix+1],   z1 = positions[ix+2];
        const x2 = positions[jx],   y2 = positions[jx+1],   z2 = positions[jx+2];

        const dx = x2-x1, dy=y2-y1, dz=z2-z1;
        const d2 = dx*dx+dy*dy+dz*dz;
        if (d2 > 0.35) { s--; continue; }

        const vix = velocities[ix], viy = velocities[ix+1], viz = velocities[ix+2];
        const vjx = velocities[jx], vjy = velocities[jx+1], vjz = velocities[jx+2];
        const mi = Math.sqrt(vix*vix+viy*viy+viz*viz) + 1e-6;
        const mj = Math.sqrt(vjx*vjx+vjy*vjy+vjz*vjz) + 1e-6;
        const dot = (vix*vjx+viy*vjy+viz*vjz)/(mi*mj);

        if (dot < lerp(0.35, 0.78, coh)) { s--; continue; }

        filPos[w++] = x1; filPos[w++] = y1; filPos[w++] = z1;
        filPos[w++] = x2; filPos[w++] = y2; filPos[w++] = z2;
      }

      for (; w < filPos.length; w++) filPos[w] = 0;

      filGeom.attributes.position.needsUpdate = true;
      filMat.opacity = 0.02 + 0.30 * strength01;

      // Warm tint as it strengthens
      const warm = strength01;
      const r = lerp(1.0, 1.0, warm);
      const g = lerp(1.0, 0.80, warm);
      const b = lerp(1.0, 0.55, warm);
      filMat.color.setRGB(r, g, b);
    }

    // ============================================================
    // 4) Run DNA / timing / shift
    // ============================================================
    const t0 = now();
    const END_AT_MS = 95000;

    // Baseline physics (slightly higher energy to feel responsive)
    let baseAlpha   = randf(1.10, 1.90);
    let baseBeta    = randf(0.80, 1.35);
    let baseNoise   = randf(0.010, 0.018);
    let baseDamping = randf(0.982, 0.988);

    // Filaments thresholds
    const filThresh = randf(0.44, 0.56);
    const filGrowSpan = randf(0.10, 0.18);

    // Shift trigger
    const stableCohThresh = randf(0.46, 0.58);
    const stableHoldMs = randf(2400, 4200);
    const shiftLatestMs = randf(65000, 78000);

    const shiftTypeRoll = rand();
    const shiftType = shiftTypeRoll < 0.45 ? "ROTATE_W" : (shiftTypeRoll < 0.85 ? "FLIP_CHANNEL" : "COUPLING_DROP");
    let shifted = false;
    let stableSince = null;

    // ============================================================
    // 5) MediaPipe Hands + Landmark overlay
    // ============================================================
    const videoEl = document.getElementById("video");
    const overlayEl = document.getElementById("overlay");
    const octx = overlayEl.getContext("2d");

    const badgeEl = document.getElementById("badge");
    const cohEl   = document.getElementById("coh");
    const phEl    = document.getElementById("ph");
    const famEl   = document.getElementById("fam");

    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [0,9],[9,10],[10,11],[11,12],
      [0,13],[13,14],[14,15],[15,16],
      [0,17],[17,18],[18,19],[19,20],
      [5,9],[9,13],[13,17]
    ];

    function resizeOverlayToVideo() {
      const w = videoEl.videoWidth || 640;
      const h = videoEl.videoHeight || 480;
      overlayEl.width = w;
      overlayEl.height = h;
    }

    function dist2(a, b) { const dx=a.x-b.x, dy=a.y-b.y; return dx*dx+dy*dy; }
    function dist(a, b) { return Math.sqrt(dist2(a,b)); }

    function fingerExtended(lm, tipIdx, pipIdx) { return lm[tipIdx].y < lm[pipIdx].y; }

    function classifyGesture(lm) {
      const idxExt  = fingerExtended(lm, 8, 6);
      const midExt  = fingerExtended(lm, 12, 10);
      const ringExt = fingerExtended(lm, 16, 14);
      const pinkExt = fingerExtended(lm, 20, 18);
      const pinch = dist2(lm[4], lm[8]) < 0.0022;
      const point = idxExt && !(midExt || ringExt || pinkExt);
      const open  = idxExt && midExt && ringExt && pinkExt && !pinch;
      const fist  = !(idxExt || midExt || ringExt || pinkExt) && !pinch;
      if (pinch) return "PINCH";
      if (open)  return "OPEN";
      if (point) return "POINT";
      if (fist)  return "FIST";
      return "UNKNOWN";
    }

    function curvatureFromHistory(hist) {
      if (hist.length < 3) return 0;
      const a = hist[hist.length-3];
      const b = hist[hist.length-2];
      const c = hist[hist.length-1];
      const abx = b.x-a.x, aby=b.y-a.y;
      const bcx = c.x-b.x, bcy=c.y-b.y;
      const ab = Math.sqrt(abx*abx+aby*aby) + 1e-6;
      const bc = Math.sqrt(bcx*bcx+bcy*bcy) + 1e-6;
      const dot = (abx*bcx+aby*bcy)/(ab*bc);
      const ang = Math.acos(clamp(dot, -1, 1));
      return clamp(ang / Math.PI, 0, 1);
    }

    function opennessScore(lm) {
      const idx = fingerExtended(lm,8,6) ? 1:0;
      const mid = fingerExtended(lm,12,10) ? 1:0;
      const ring= fingerExtended(lm,16,14) ? 1:0;
      const pink= fingerExtended(lm,20,18) ? 1:0;
      return (idx+mid+ring+pink)/4;
    }

    function pointnessScore(lm) {
      const idx = fingerExtended(lm,8,6) ? 1:0;
      const mid = fingerExtended(lm,12,10) ? 1:0;
      const ring= fingerExtended(lm,16,14) ? 1:0;
      const pink= fingerExtended(lm,20,18) ? 1:0;
      const othersCurled = 1 - ((mid+ring+pink)/3);
      return clamp(idx * othersCurled, 0, 1);
    }

    function pinchStrength(lm) {
      const d = dist(lm[4], lm[8]);
      return clamp(1.0 - (d - 0.02) / (0.10 - 0.02), 0, 1);
    }

    const handState = {
      right: {
        present:false, x:0, y:0, vx:0, vy:0,
        gesture:"UNKNOWN", gSmooth:"UNKNOWN",
        pinch:0, open:0, point:0, fist:0, speed:0, curv:0,
        hist:[]
      },
      left: {
        present:false, x:0, y:0, vx:0, vy:0,
        gesture:"UNKNOWN", gSmooth:"UNKNOWN",
        pinch:0, open:0, point:0, fist:0, speed:0, curv:0,
        hist:[]
      },
    };

    // FAST response smoothing (higher alpha)
    const SMOOTH_POS = 0.55;
    const SMOOTH_VEL = 0.55;
    const SMOOTH_FEAT = 0.55;
    const SMOOTH_CURV = 0.45;

    function updateHand(which, lm) {
      const cx = lm[9].x;
      const cy = lm[9].y;
      const wx = (cx - 0.5) * 3.3;
      const wy = -(cy - 0.5) * 2.1;

      const hs = handState[which];
      hs.present = true;

      const dvx = (wx - hs.x);
      const dvy = (wy - hs.y);

      hs.vx = smoothStep(hs.vx, dvx, SMOOTH_VEL);
      hs.vy = smoothStep(hs.vy, dvy, SMOOTH_VEL);
      hs.x  = smoothStep(hs.x,  wx,  SMOOTH_POS);
      hs.y  = smoothStep(hs.y,  wy,  SMOOTH_POS);

      const sp = Math.sqrt(hs.vx*hs.vx + hs.vy*hs.vy);
      hs.speed = smoothStep(hs.speed, sp, SMOOTH_FEAT);

      const pin = pinchStrength(lm);
      const opn = opennessScore(lm);
      const pnt = pointnessScore(lm);
      const fst = clamp(1.0 - opn, 0, 1);

      hs.pinch = smoothStep(hs.pinch, pin, SMOOTH_FEAT);
      hs.open  = smoothStep(hs.open,  opn, SMOOTH_FEAT);
      hs.point = smoothStep(hs.point, pnt, SMOOTH_FEAT);
      hs.fist  = smoothStep(hs.fist,  fst, SMOOTH_FEAT);

      hs.hist.push({x:cx, y:cy});
      if (hs.hist.length > 18) hs.hist.shift();
      const curv = curvatureFromHistory(hs.hist);
      hs.curv = smoothStep(hs.curv, curv, SMOOTH_CURV);

      const g = classifyGesture(lm);
      hs.gesture = g;

      // Faster gesture stabilization
      if (hs._lastG === g) hs._gCount = (hs._gCount || 0) + 1;
      else { hs._lastG = g; hs._gCount = 0; }
      hs.gSmooth = (hs._gCount > 1) ? g : hs.gSmooth;
    }

    function clearHands() {
      handState.right.present = false;
      handState.left.present  = false;
    }

    const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}` });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      clearHands();

      // Overlay
      if (videoEl.videoWidth && overlayEl.width !== videoEl.videoWidth) resizeOverlayToVideo();
      octx.clearRect(0, 0, overlayEl.width, overlayEl.height);

      if (!results.multiHandLandmarks || !results.multiHandedness) return;

      for (let i=0;i<results.multiHandLandmarks.length;i++){
        const lm = results.multiHandLandmarks[i];
        const handed = results.multiHandedness[i].label; // "Left"/"Right"

        if (handed === "Right") updateHand("right", lm);
        if (handed === "Left")  updateHand("left",  lm);

        const isRight = handed === "Right";
        octx.lineWidth = 3;
        octx.strokeStyle = isRight ? "rgba(0,255,120,0.95)" : "rgba(80,220,255,0.95)";
        octx.fillStyle   = isRight ? "rgba(0,255,120,0.95)" : "rgba(80,220,255,0.95)";

        // connections
        octx.beginPath();
        for (const [a,b] of HAND_CONNECTIONS) {
          const ax = lm[a].x * overlayEl.width;
          const ay = lm[a].y * overlayEl.height;
          const bx = lm[b].x * overlayEl.width;
          const by = lm[b].y * overlayEl.height;
          octx.moveTo(ax, ay);
          octx.lineTo(bx, by);
        }
        octx.stroke();

        // points
        for (let k=0;k<lm.length;k++){
          const x = lm[k].x * overlayEl.width;
          const y = lm[k].y * overlayEl.height;
          octx.beginPath();
          octx.arc(x, y, 4, 0, Math.PI*2);
          octx.fill();
        }
      }
    });

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
      videoEl.srcObject = stream;
      await videoEl.play();
      resizeOverlayToVideo();

      const cam = new Camera(videoEl, {
        onFrame: async () => { await hands.send({ image: videoEl }); },
        width: 640, height: 480
      });
      cam.start();
    }

    startCamera().catch(err => {
      badgeEl.textContent = "Camera blocked";
      document.getElementById("hint").innerHTML =
        "Camera permission is needed for gesture control.<br/>Enable it and reload.";
      console.error(err);
    });

    // ============================================================
    // 6) Gesture vector g(t)
    // ============================================================
    const GDIM = 14;
    function getGestureVector() {
      const R = handState.right;
      const L = handState.left;

      const r = R.present ? R : {pinch:0, open:0, point:0, fist:0, speed:0, curv:0};
      const l = L.present ? L : {pinch:0, open:0, point:0, fist:0, speed:0, curv:0};

      const handsDist = (R.present && L.present)
        ? clamp(Math.sqrt((R.x-L.x)**2 + (R.y-L.y)**2) / 4.2, 0, 1)
        : 0;

      const symmetry = (R.present && L.present)
        ? clamp(1.0 - Math.abs((R.x + L.x) / 3.3), 0, 1)
        : 0;

      return new Float32Array([
        r.pinch, r.open, r.point, r.fist, clamp(r.speed/0.22, 0, 1), r.curv,
        l.pinch, l.open, l.point, l.fist, clamp(l.speed/0.22, 0, 1), l.curv,
        handsDist, symmetry
      ]);
    }

    // ============================================================
    // 7) Seeded Grammar (u = tanh(Wg+b))
    // ============================================================
    const UDIM = 8;

    const families = [
      { name:"ATTRACTOR", weights:[1.35, 0.75, 1.25, 0.70, 1.10, 0.85, 0.95, 0.80] },
      { name:"VORTEX",    weights:[0.85, 1.45, 1.05, 0.85, 1.05, 0.95, 0.85, 0.85] },
      { name:"LATTICE",   weights:[1.05, 0.95, 1.25, 0.70, 1.10, 0.80, 1.35, 0.90] },
      { name:"TURBULENCE",weights:[0.85, 1.10, 0.90, 1.40, 0.95, 1.05, 0.75, 0.90] }
    ];
    const family = families[Math.floor(rand()*families.length)];
    famEl.textContent = family.name;

    const W = new Float32Array(UDIM * GDIM);
    const b = new Float32Array(UDIM);
    function idx(u, g) { return u*GDIM + g; }

    const perm = Array.from({length: GDIM}, (_,i)=>i);
    for (let i=perm.length-1;i>0;i--) {
      const j = Math.floor(rand()*(i+1));
      [perm[i], perm[j]] = [perm[j], perm[i]];
    }

    for (let u=0; u<UDIM; u++) {
      b[u] = randf(-0.20, 0.20);
      for (let g=0; g<GDIM; g++) W[idx(u,g)] = randf(-0.18, 0.18);

      const dom = [];
      if (u===0) dom.push(0, 12);         // radial
      if (u===1) dom.push(1, 5);          // swirl
      if (u===2) dom.push(13, 7);         // align
      if (u===3) dom.push(9, 4);          // noise
      if (u===4) dom.push(6, 10);         // damp
      if (u===5) dom.push(2, 4);          // shear
      if (u===6) dom.push(13, 12, 8);     // crystal
      if (u===7) dom.push(12, 6);         // warp

      for (const g0 of dom) {
        const g = perm[g0];
        W[idx(u,g)] += randf(0.55, 1.05) * (rand() < 0.5 ? -1 : 1);
      }

      const fw = family.weights[u];
      b[u] += randf(-0.12, 0.12) * fw;
    }

    const channelGate = new Float32Array(UDIM);
    for (let u=0; u<UDIM; u++) channelGate[u] = randf(0.05, 0.22);

    const channelScale = new Float32Array(UDIM);
    for (let u=0; u<UDIM; u++) channelScale[u] = family.weights[u] * randf(0.70, 1.10);

    const uVec = new Float32Array(UDIM);
    function computeControlU(gVec) {
      for (let u=0; u<UDIM; u++) {
        let s = b[u];
        for (let g=0; g<GDIM; g++) s += W[idx(u,g)] * gVec[g];
        let ur = Math.tanh(s);

        const az = Math.abs(ur);
        if (az < channelGate[u]) ur = 0;

        ur = clamp(ur * channelScale[u], -1.25, 1.25);
        uVec[u] = ur;
      }

      const mags = [];
      for (let u=0; u<UDIM; u++) mags.push([u, Math.abs(uVec[u])]);
      mags.sort((a,b)=>b[1]-a[1]);
      const keep = new Set(mags.slice(0,3).map(x=>x[0]));
      for (let u=0; u<UDIM; u++) if (!keep.has(u)) uVec[u] *= 0.45;

      return uVec;
    }

    // ============================================================
    // 8) Combo inventory
    // ============================================================
    const comboCounts = new Map();
    const comboTimeline = [];
    let lastComboKey = null;
    let lastComboChangeT = 0;

    function comboKey(L, R) { return `L=${L}|R=${R}`; }
    function recordComboEvent(t, phaseLabel, L, R, coh) {
      const key = comboKey(L, R);
      const meaningful = (R !== "NONE" && R !== "UNKNOWN");
      const changed = (key !== lastComboKey);
      if (changed) { lastComboKey = key; lastComboChangeT = t; return; }
      if (!meaningful) return;
      if (t - lastComboChangeT < 220) return;

      const lastEvt = comboTimeline.at(-1);
      if (lastEvt && lastEvt.key === key && (t - lastEvt.t) < 560) return;

      comboCounts.set(key, (comboCounts.get(key) || 0) + 1);
      comboTimeline.push({ t: Math.round(t), phase: phaseLabel, L, R, coh:+coh.toFixed(3), key });
    }

    // ============================================================
    // 9) Logs (CI)
    // ============================================================
    const logs = {
      t: [],
      coherence: [],
      speed: [],
      phase: [],
      filStrength: [],
      actEntropy: [],
      rightGesture: [],
      leftGesture: []
    };

    const BIN = 8;
    const binCounts = new Array(BIN*BIN).fill(0);
    function updateEntropySample(rx, ry) {
      const nx = clamp((rx/3.3 + 0.5), 0, 0.999);
      const ny = clamp((-ry/2.1 + 0.5), 0, 0.999);
      const bx = Math.floor(nx * BIN);
      const by = Math.floor(ny * BIN);
      binCounts[by*BIN + bx]++;

      let total = 0;
      for (const c of binCounts) total += c;

      let H = 0;
      for (const c of binCounts) {
        if (!c) continue;
        const p = c / total;
        H += -p * Math.log(p);
      }
      return H / Math.log(BIN*BIN);
    }

    // ============================================================
    // 10) Coherence, visuals, bounds
    // ============================================================
    function computeCoherence() {
      let mx=0, my=0, mz=0;
      for (let i=0;i<N;i++){
        const vx = velocities[3*i+0], vy = velocities[3*i+1], vz = velocities[3*i+2];
        const mag = Math.sqrt(vx*vx+vy*vy+vz*vz) + 1e-6;
        mx += vx/mag; my += vy/mag; mz += vz/mag;
      }
      mx/=N; my/=N; mz/=N;
      return Math.sqrt(mx*mx+my*my+mz*mz);
    }

    function meanSpeed() {
      let s=0;
      for (let i=0;i<N;i++){
        const vx = velocities[3*i+0], vy = velocities[3*i+1], vz = velocities[3*i+2];
        s += Math.sqrt(vx*vx+vy*vy+vz*vz);
      }
      return s/N;
    }

    function enforceBounds(i) {
      const x = positions[3*i+0], y = positions[3*i+1], z = positions[3*i+2];
      const r = Math.sqrt(x*x + y*y + z*z);
      const R = 2.05;
      if (r > R) {
        const k = (r - R) * 0.016;
        velocities[3*i+0] -= k * (x/r);
        velocities[3*i+1] -= k * (y/r);
        velocities[3*i+2] -= k * (z/r);
      }
    }

    function updateColorsFromCoherenceAndFilaments(coh, filStrength) {
      const brightness = clamp(0.30 + coh*0.90, 0.22, 1.0);
      const warm = clamp(filStrength, 0, 1);

      const baseCool = { r: 0.18, g: 0.30, b: 0.72 };
      const baseWarm = { r: 0.95, g: 0.62, b: 0.28 };

      for (let i=0;i<N;i++){
        const p = (phase[i] * 0.5 + 0.5);

        const br = lerp(baseCool.r, baseWarm.r, warm);
        const bg = lerp(baseCool.g, baseWarm.g, warm);
        const bb = lerp(baseCool.b, baseWarm.b, warm);

        const r = lerp(br, 0.98, brightness) * lerp(0.62, 1.0, p);
        const g = lerp(bg, 0.99, brightness) * lerp(0.74, 1.0, 1.0-p*0.30);
        const b = lerp(bb, 1.00, brightness) * lerp(0.75, 1.0, 0.55 + 0.45*(1.0-warm));

        colors[3*i+0] = r;
        colors[3*i+1] = g;
        colors[3*i+2] = b;
      }
      geom.attributes.color.needsUpdate = true;
    }

    // ============================================================
    // 11) Shift logic
    // ============================================================
    function maybeTriggerShift(t, coh, phaseLabel) {
      if (shifted) return;
      if (t < 18000) return;

      const active = handState.right.present;
      if (active && coh >= stableCohThresh && phaseLabel !== "C") {
        if (stableSince === null) stableSince = t;
        const held = t - stableSince;
        if (held >= stableHoldMs) { shifted = true; applyShift(); return; }
      } else {
        stableSince = null;
      }

      if (t >= shiftLatestMs) { shifted = true; applyShift(); }
    }

    function applyShift() {
      if (shiftType === "ROTATE_W") {
        const a = Math.floor(rand()*GDIM);
        let bdim = Math.floor(rand()*GDIM);
        if (bdim === a) bdim = (bdim+1)%GDIM;
        for (let u=0; u<UDIM; u++) {
          const ia = idx(u,a), ib = idx(u,bdim);
          const tmp = W[ia]; W[ia] = W[ib]; W[ib] = tmp;
        }
      } else if (shiftType === "FLIP_CHANNEL") {
        const candidates = [0,1,2,5,6,7];
        const ch = candidates[Math.floor(rand()*candidates.length)];
        channelScale[ch] *= -1;
      } else if (shiftType === "COUPLING_DROP") {
        channelGate[2] = clamp(channelGate[2] + 0.10, 0.05, 0.35);
        channelScale[2] *= 0.65;
      }
      baseNoise *= randf(0.92, 1.12);
    }

    // ============================================================
    // 12) CI computation (unchanged)
    // ============================================================
    function computeCI() {
      const norm01 = (x, a, b) => clamp((x - a) / (b - a + 1e-9), 0, 1);
      const T = logs.t.length;
      if (T < 12) return null;

      let shiftT = null;
      for (let i=0;i<T;i++){
        if (logs.phase[i] === "C") { shiftT = logs.t[i]; break; }
      }
      if (shiftT === null) shiftT = logs.t[Math.floor(T*0.65)];

      const pre = [], post = [];
      for (let i=0;i<T;i++){
        if (logs.t[i] < shiftT) pre.push(i);
        else post.push(i);
      }

      const mean = (arr, f) => arr.reduce((s,i)=>s+f(i),0)/(arr.length||1);
      const slope = (arr, f) => {
        const mt = mean(arr, i=>logs.t[i]);
        const my = mean(arr, i=>f(i));
        let num=0, den=0;
        for (const i of arr){
          const dt = logs.t[i]-mt;
          num += dt*(f(i)-my);
          den += dt*dt;
        }
        return num/(den+1e-9);
      };

      const uniq = (arr) => new Set(arr).size;
      const rightGuniq = uniq(logs.rightGesture.filter(g=>g!=="UNKNOWN" && g!=="NONE"));
      const leftGuniq  = uniq(logs.leftGesture.filter(g=>g!=="UNKNOWN" && g!=="NONE"));
      const entEarly = mean(pre.filter(i=>logs.t[i]<25000), i=>logs.actEntropy[i] ?? 0);
      const E = norm01((rightGuniq + 0.7*leftGuniq + 1.2*entEarly), 1.0, 5.5);

      const early = pre.filter(i => logs.t[i] < 35000);
      const cohSlopeEarly = slope(early, i=>logs.coherence[i]);
      const entSlopeEarly = slope(early, i=>logs.actEntropy[i] ?? 0);
      const M = norm01((cohSlopeEarly*100000) + (-entSlopeEarly*60000), -0.2, 1.4);

      const postCohSlope = slope(post, i=>logs.coherence[i]);
      const P = norm01(postCohSlope*100000, -0.6, 1.2);

      function dominantGesture(indices) {
        const counts = new Map();
        for (const i of indices) {
          const g = logs.rightGesture[i];
          if (g==="UNKNOWN" || g==="NONE") continue;
          counts.set(g, (counts.get(g)||0)+1);
        }
        let best="UNKNOWN", bestC=0;
        for (const [g,c] of counts.entries()){
          if (c>bestC){bestC=c; best=g;}
        }
        return best;
      }
      const domPre = dominantGesture(pre.slice(-Math.min(60, pre.length)));
      let adaptMs = 99999;
      for (let i=0;i<T;i++){
        if (logs.t[i] < shiftT) continue;
        const window = [];
        for (let j=i;j<T && logs.t[j] < logs.t[i] + 1100;j++) window.push(j);
        if (window.length < 8) continue;

        let diff=0, total=0;
        for (const j of window){
          const g = logs.rightGesture[j];
          if (g==="UNKNOWN" || g==="NONE") continue;
          total++;
          if (g !== domPre) diff++;
        }
        if (total >= 6 && diff/total >= 0.75) { adaptMs = logs.t[i]-shiftT; break; }
      }
      const A = 1.0 - norm01(adaptMs, 900, 13000);

      const cohPost = mean(post, i=>logs.coherence[i]);
      const entPost = mean(post, i=>logs.actEntropy[i] ?? 0);
      const filPost = mean(post, i=>logs.filStrength[i] ?? 0);
      const D = norm01((cohPost*0.7 + entPost*0.45 + filPost*0.35), 0.12, 1.2);

      const vec = { E:+E.toFixed(3), M:+M.toFixed(3), P:+P.toFixed(3), A:+A.toFixed(3), D:+D.toFixed(3) };
      const mag = Math.sqrt(E*E+M*M+P*P+A*A+D*D);

      return {
        vec,
        mag:+mag.toFixed(3),
        shiftT: Math.round(shiftT),
        shiftType,
        family: family.name,
        params: {
          baseAlpha:+baseAlpha.toFixed(3), baseBeta:+baseBeta.toFixed(3),
          baseNoise:+baseNoise.toFixed(4), baseDamping:+baseDamping.toFixed(4),
          filThresh:+filThresh.toFixed(3), filGrowSpan:+filGrowSpan.toFixed(3),
          stableCohThresh:+stableCohThresh.toFixed(2), stableHoldMs: Math.round(stableHoldMs)
        }
      };
    }

    // ============================================================
    // 13) CI particle text morph
    // ============================================================
    let showCI = false;
    let ciTextTargets = null;
    let ciTextAlpha = 0;
    let ciHold = false;

    function formatCIText(ci) { return `CI ${ci.mag.toFixed(2)}`; }

    function buildTextTargets(text, options = {}) {
      const {
        width = 900,
        height = 260,
        font = "bold 160px ui-sans-serif, system-ui, Segoe UI, Arial",
        padding = 30,
        pointStep = 3,
        worldW = 3.2,
        worldH = 0.95,
        zJitter = 0.08,
        centerY = 0.0
      } = options;

      const c = document.createElement("canvas");
      c.width = width;
      c.height = height;
      const ctx = c.getContext("2d", { willReadFrequently: true });

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, width, height);

      ctx.font = font;
      ctx.textBaseline = "middle";
      ctx.textAlign = "center";

      ctx.lineWidth = 10;
      ctx.strokeStyle = "rgba(255,255,255,0.55)";
      ctx.fillStyle = "white";
      ctx.strokeText(text, width / 2, height / 2);
      ctx.fillText(text, width / 2, height / 2);

      const img = ctx.getImageData(0, 0, width, height);
      const data = img.data;
      const pts = [];

      for (let y = padding; y < height - padding; y += pointStep) {
        for (let x = padding; x < width - padding; x += pointStep) {
          const idx = (y * width + x) * 4;
          const a = data[idx + 3];
          if (a > 40) {
            const nx = (x / width) * 2 - 1;
            const ny = (y / height) * 2 - 1;
            const wx = nx * (worldW / 2);
            const wy = -ny * (worldH / 2) + centerY;
            const wz = (Math.random() * 2 - 1) * zJitter;
            pts.push([wx, wy, wz]);
          }
        }
      }

      if (pts.length === 0) return null;

      const target = new Float32Array(N * 3);

      if (pts.length >= N) {
        const idxs = Array.from({ length: pts.length }, (_, i) => i);
        for (let i = idxs.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
        }
        for (let i = 0; i < N; i++) {
          const p = pts[idxs[i]];
          target[3 * i + 0] = p[0];
          target[3 * i + 1] = p[1];
          target[3 * i + 2] = p[2];
        }
      } else {
        for (let i = 0; i < N; i++) {
          const p = pts[i % pts.length];
          target[3 * i + 0] = p[0];
          target[3 * i + 1] = p[1];
          target[3 * i + 2] = p[2];
        }
      }

      return target;
    }

    function applyTextMorph(dt) {
      if (!showCI || !ciTextTargets) return;

      ciTextAlpha = Math.min(1, ciTextAlpha + dt * 0.22);

      const pull = 2.2 * ciTextAlpha;
      const damp = 0.90;
      const swirlKill = 0.25 * ciTextAlpha;

      for (let i = 0; i < N; i++) {
        const ix = 3 * i;
        const x = positions[ix + 0], y = positions[ix + 1], z = positions[ix + 2];
        const tx = ciTextTargets[ix + 0], ty = ciTextTargets[ix + 1], tz = ciTextTargets[ix + 2];

        let vx = velocities[ix + 0], vy = velocities[ix + 1], vz = velocities[ix + 2];

        const dx = tx - x, dy = ty - y, dz = tz - z;

        vx += dx * pull * dt;
        vy += dy * pull * dt;
        vz += dz * pull * dt;

        vx *= lerp(1.0, damp, ciTextAlpha);
        vy *= lerp(1.0, damp, ciTextAlpha);
        vz *= lerp(1.0, damp, ciTextAlpha);
        vz *= (1.0 - swirlKill);

        velocities[ix + 0] = vx;
        velocities[ix + 1] = vy;
        velocities[ix + 2] = vz;
      }
    }

    // ============================================================
    // 14) Main sim loop — boosted forces for instant response
    // ============================================================
    let last = now();
    let lastLog = now();

    function animate() {
      requestAnimationFrame(animate);

      const t = now() - t0;
      const dt = Math.min(0.033, (now() - last)/1000);
      last = now();

      let phaseLabel = "A";
      if (t > 32000 && !shifted) phaseLabel = "B";
      if (shifted) phaseLabel = "C";
      phEl.textContent = phaseLabel;

      badgeEl.textContent = showCI
        ? "Result"
        : (shifted ? "Adapt" : (t < 2500 ? "Explore" : (phaseLabel==="B" ? "Refine" : "Discover")));

      const gVec = getGestureVector();
      const u = computeControlU(gVec);

      const radial  = u[0];
      const swirl   = u[1];
      const align   = u[2];
      const noiseCh = u[3];
      const dampCh  = u[4];
      const shear   = u[5];
      const crystal = u[6];
      const warp    = u[7];

      const hx = handState.right.present ? handState.right.x : 0;
      const hy = handState.right.present ? handState.right.y : 0;
      const hvx = handState.right.present ? clamp(handState.right.vx, -0.35, 0.35) : 0;
      const hvy = handState.right.present ? clamp(handState.right.vy, -0.35, 0.35) : 0;

      const phaseNoise = baseNoise * (phaseLabel==="B" ? 0.84 : 1.0) * (phaseLabel==="C" ? 0.95 : 1.0);
      const phaseDamp  = baseDamping + (phaseLabel==="B" ? 0.002 : 0) + (phaseLabel==="C" ? 0.001 : 0);

      // Global alignment
      const alignGain = (0.06 + 0.10*Math.abs(align)) * dt;
      if (!showCI) {
        let mvx=0,mvy=0,mvz=0;
        for (let i=0;i<N;i++){
          mvx += velocities[3*i+0];
          mvy += velocities[3*i+1];
          mvz += velocities[3*i+2];
        }
        mvx/=N; mvy/=N; mvz/=N;
        for (let i=0;i<N;i++){
          const ix = 3*i;
          velocities[ix+0] += alignGain * align * (mvx - velocities[ix+0]);
          velocities[ix+1] += alignGain * align * (mvy - velocities[ix+1]);
          velocities[ix+2] += alignGain * align * (mvz - velocities[ix+2]);
        }
      }

      const R0 = 0.58;
      const k = 1.35;
      const eps = 0.03;

      for (let i=0;i<N;i++){
        const ix = 3*i;
        let x = positions[ix], y = positions[ix+1], z = positions[ix+2];
        let vx = velocities[ix], vy = velocities[ix+1], vz = velocities[ix+2];

        if (!showCI) {
          // Noise
          const nGain = phaseNoise * (1.0 + 0.65*Math.abs(noiseCh));
          vx += nGain * randn() * dt;
          vy += nGain * randn() * dt;
          vz += (nGain*0.6) * randn() * dt;

          // Hand forces
          if (handState.right.present) {
            const dx = hx - x;
            const dy = hy - y;
            const d2 = dx*dx + dy*dy;
            const d  = Math.sqrt(d2) + 1e-6;
            const rGate = Math.exp(-d2 / (R0*R0 + 1e-6));

            const nx = dx / (d + 1e-6);
            const ny = dy / (d + 1e-6);
            const inv = 1.0 / (Math.pow(d + eps, k));

            // BOOSTED gains for instant response
            const fR = (baseAlpha * 1.9) * radial * inv * rGate;
            vx += fR * nx * dt;
            vy += fR * ny * dt;

            const [tx, ty] = rotate90(nx, ny);
            const fS = (baseBeta * 1.7) * swirl * inv * rGate;
            vx += fS * tx * dt;
            vy += fS * ty * dt;

            const fB = 2.2 * shear * inv * rGate;
            vx += fB * hvx * dt;
            vy += fB * hvy * dt;

            if (warp !== 0) {
              const cx = 0, cy = 0;
              const wx = (warp > 0) ? (hx - x) : (cx - x);
              const wy = (warp > 0) ? (hy - y) : (cy - y);
              const wd = Math.sqrt(wx*wx + wy*wy) + 1e-6;
              const wn = 0.08 * warp * rGate; // slightly stronger warp
              vx += wn * (wx/wd) * dt;
              vy += wn * (wy/wd) * dt;
            }
          }

          const dMult = clamp(phaseDamp + 0.010*Math.abs(dampCh), 0.968, 0.995);
          vx *= dMult;
          vy *= dMult;
          vz *= dMult;

          x += vx;
          y += vy;
          z += vz;

          positions[ix]   = x; positions[ix+1] = y; positions[ix+2] = z;
          velocities[ix]  = vx; velocities[ix+1] = vy; velocities[ix+2] = vz;

          enforceBounds(i);
          phase[i] = clamp(phase[i] + 0.0022*randn()*dt, -1, 1);
        }
      }

      geom.attributes.position.needsUpdate = true;

      const coh = computeCoherence();
      cohEl.textContent = coh.toFixed(2);

      const crystalBoost = clamp(0.18*Math.abs(crystal), 0, 0.22);
      const filStrength = clamp((coh - filThresh) / filGrowSpan + crystalBoost, 0, 1);

      updateFilaments(coh, filStrength);
      updateColorsFromCoherenceAndFilaments(coh, filStrength);

      if (!showCI) maybeTriggerShift(t, coh, phaseLabel);

      const L = handState.left.present ? handState.left.gSmooth : "NONE";
      const R = handState.right.present ? handState.right.gSmooth : "NONE";
      recordComboEvent(t, phaseLabel, L, R, coh);

      // log ~15Hz
      const tNow = now();
      if (tNow - lastLog > 66) {
        lastLog = tNow;
        logs.t.push(t);
        logs.coherence.push(coh);
        logs.speed.push(meanSpeed());
        logs.phase.push(shifted ? "C" : (t > 32000 ? "B" : "A"));
        logs.filStrength.push(filStrength);

        const H = (handState.right.present) ? updateEntropySample(handState.right.x, handState.right.y) : (logs.actEntropy.at(-1) ?? 0);
        logs.actEntropy.push(H);

        logs.rightGesture.push(handState.right.present ? handState.right.gSmooth : "NONE");
        logs.leftGesture.push(handState.left.present ? handState.left.gSmooth : "NONE");
      }

      if (t > END_AT_MS && !ciHold) {
        ciHold = true;
        const ci = computeCI();
        badgeEl.textContent = "Done";

        if (ci) {
          const txt = formatCIText(ci);
          ciTextTargets = buildTextTargets(txt, { worldW: 3.2, worldH: 0.95, pointStep: 3 });
          showCI = true;
          ciTextAlpha = 0;

          const comboCountsObj = Object.fromEntries([...comboCounts.entries()].sort((a,b)=>b[1]-a[1]));
          console.log("Curiosity Index (v2.3):", ci);
          console.log("Gesture Combo Counts (sorted):", comboCountsObj);
          console.log("Gesture Combo Timeline (full):", comboTimeline);

          document.getElementById("hint").innerHTML =
            "Done. Your CI is forming in the field.<br/>Refresh to try again (new run DNA each time).";
        } else {
          document.getElementById("hint").innerHTML =
            "Done, but not enough data to compute CI. Try again with more interaction.";
        }
      }

      applyTextMorph(dt);

      // camera wobble
      const wobble = showCI ? 0.02 : 0.06;
      camera.position.x = Math.sin((t*0.00025)) * wobble;
      camera.position.y = Math.cos((t*0.00022)) * wobble * 0.6;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
