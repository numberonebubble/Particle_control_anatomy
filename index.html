<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Particle Battle: 2 Player</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', sans-serif; }
        #input_video { position: absolute; top: 0; left: 0; opacity: 0; pointer-events: none; z-index: -1; }
        
        /* HUD Layout */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
        }
        
        /* Scores */
        .score-panel {
            position: absolute; top: 20px; padding: 15px 30px;
            background: rgba(0,0,0,0.5); border-radius: 12px;
            color: white; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1);
        }
        #p1-score { left: 20px; border-left: 5px solid #00d2ff; }
        #p2-score { right: 20px; border-right: 5px solid #ff0055; text-align: right; }
        .score-val { font-size: 2.5rem; font-weight: bold; display: block; }
        .player-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; }

        /* Central Game Message */
        #center-msg {
            text-align: center; margin-top: 15vh;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #target-word {
            font-size: 4rem; font-weight: 900; color: #fff;
            text-transform: uppercase; letter-spacing: 5px;
            transition: transform 0.2s;
        }
        #sub-hint {
            font-size: 1.5rem; color: #ffd700; margin-top: 10px;
            background: rgba(0,0,0,0.6); display: inline-block; padding: 5px 15px; border-radius: 8px;
        }

        /* Gestures Guide Bottom */
        #guide {
            display: flex; justify-content: center; gap: 40px; padding-bottom: 30px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }
        .guide-item { text-align: center; color: rgba(255,255,255,0.6); }
        .guide-icon { font-size: 1.5rem; display: block; margin-bottom: 5px; color: white;}
        
        /* Feedback */
        .detected-gesture {
            position: absolute; top: 120px; 
            font-size: 1.2rem; font-weight: bold; opacity: 0; transition: opacity 0.3s;
            background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 4px; color: white;
        }
        #p1-detect { left: 20px; color: #00d2ff; }
        #p2-detect { right: 20px; color: #ff0055; }
        
    </style>
</head>
<body>

    <div id="hud">
        <div id="p1-score" class="score-panel">
            <span class="player-label">Player 1</span>
            <span class="score-val" id="s1">0</span>
        </div>
        <div id="p2-score" class="score-panel">
            <span class="player-label">Player 2</span>
            <span class="score-val" id="s2">0</span>
        </div>

        <div id="center-msg">
            <div id="target-word">Loading...</div>
            <div id="sub-hint">Please allow camera</div>
        </div>

        <div id="p1-detect" class="detected-gesture">Detected: None</div>
        <div id="p2-detect" class="detected-gesture">Detected: None</div>

        <div id="guide">
            <div class="guide-item"><span class="guide-icon">✊ C</span>Cube</div>
            <div class="guide-item"><span class="guide-icon">👌 O</span>Sphere</div>
            <div class="guide-item"><span class="guide-icon">👆 L</span>Helix</div>
            <div class="guide-item"><span class="guide-icon">✌️ V</span>Pyramid</div>
        </div>
    </div>

    <video id="input_video"></video>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        // --- Game Config & State ---
        const TARGETS = [
            { name: "CUBE",   letter: "C", shape: "cube" },
            { name: "SPHERE", letter: "O", shape: "sphere" },
            { name: "HELIX",  letter: "L", shape: "helix" },
            { name: "PYRAMID",letter: "V", shape: "pyramid" }
        ];

        const gameState = {
            phase: 'waiting', // waiting, active, result
            targetIndex: 0,
            p1Score: 0,
            p2Score: 0,
            p1HoldTime: 0,
            p2HoldTime: 0,
            currentShape: 'cloud' // Visual shape state
        };
        const HOLD_THRESHOLD = 20; // Frames required to hold gesture to win

        // DOM Elements
        const uiTarget = document.getElementById('target-word');
        const uiHint = document.getElementById('sub-hint');
        const uiS1 = document.getElementById('s1');
        const uiS2 = document.getElementById('s2');
        const uiP1Det = document.getElementById('p1-detect');
        const uiP2Det = document.getElementById('p2-detect');

        // --- 1. Three.js Visuals ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.02);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.z = 18;
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Particle System
        const PARTICLE_COUNT = 6000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        const colorP1 = new THREE.Color(0x00d2ff); // Cyan
        const colorP2 = new THREE.Color(0xff0055); // Pink
        const colorNeu = new THREE.Color(0xffffff); // White

        // Precompute shapes
        const shapes = { cloud: [], cube: [], sphere: [], helix: [], pyramid: [] };

        for(let i=0; i<PARTICLE_COUNT; i++) {
            // Cloud (Initial)
            const x = (Math.random()-0.5)*25;
            const y = (Math.random()-0.5)*15;
            const z = (Math.random()-0.5)*10;
            positions[i*3]=x; positions[i*3+1]=y; positions[i*3+2]=z;
            shapes.cloud.push(x, y, z);
            
            // Sphere ('O')
            const theta = Math.random()*Math.PI*2;
            const phi = Math.acos((Math.random()*2)-1);
            const r = 5;
            shapes.sphere.push(r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi));

            // Cube ('C')
            const sz = 7;
            shapes.cube.push((Math.random()-0.5)*sz, (Math.random()-0.5)*sz, (Math.random()-0.5)*sz);

            // Helix ('L')
            const hA = i*0.1; 
            const hR = 3;
            const strand = (i%2===0)?0:Math.PI;
            shapes.helix.push(hR*Math.cos(hA+strand), (i/PARTICLE_COUNT)*14-7, hR*Math.sin(hA+strand));

            // Pyramid ('V')
            const pyH = (Math.random()-0.5)*10; // Height -5 to 5
            const pyR = (1 - (pyH+5)/10) * 6; // Radius gets smaller as H goes up
            const pyAng = Math.random()*Math.PI*2;
            shapes.pyramid.push(pyR*Math.cos(pyAng), pyH, pyR*Math.sin(pyAng));

            // Initial Color
            colors[i*3]=1; colors[i*3+1]=1; colors[i*3+2]=1;
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const mat = new THREE.PointsMaterial({ size: 0.15, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true });
        const particles = new THREE.Points(geometry, mat);
        scene.add(particles);

        // --- 2. Game Logic Functions ---

        function startRound() {
            gameState.phase = 'active';
            gameState.p1HoldTime = 0;
            gameState.p2HoldTime = 0;
            
            // Pick random target
            const rand = Math.floor(Math.random() * TARGETS.length);
            gameState.targetIndex = rand;
            
            // UI
            uiTarget.innerText = TARGETS[rand].name;
            uiTarget.style.color = "#ffffff";
            uiTarget.style.transform = "scale(1.0)";
            uiHint.innerText = `Sign ASL "${TARGETS[rand].letter}"`;
            
            gameState.currentShape = 'cloud'; // Reset shape to cloud while they think
            updateParticleColors(colorNeu);
        }

        function handleWin(winner) {
            gameState.phase = 'result';
            const target = TARGETS[gameState.targetIndex];
            
            // Morph to winning shape
            gameState.currentShape = target.shape;

            if(winner === 1) {
                gameState.p1Score++;
                uiS1.innerText = gameState.p1Score;
                uiTarget.innerText = "PLAYER 1 WINS!";
                uiTarget.style.color = "#00d2ff";
                updateParticleColors(colorP1);
            } else {
                gameState.p2Score++;
                uiS2.innerText = gameState.p2Score;
                uiTarget.innerText = "PLAYER 2 WINS!";
                uiTarget.style.color = "#ff0055";
                updateParticleColors(colorP2);
            }

            uiTarget.style.transform = "scale(1.2)";
            uiHint.innerText = "Next round in 3 seconds...";

            setTimeout(startRound, 3000);
        }

        function updateParticleColors(targetColor) {
            const cols = geometry.attributes.color.array;
            for(let i=0; i<PARTICLE_COUNT; i++){
                cols[i*3] = targetColor.r;
                cols[i*3+1] = targetColor.g;
                cols[i*3+2] = targetColor.b;
            }
            geometry.attributes.color.needsUpdate = true;
        }

        // --- 3. Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Morphing
            const curr = geometry.attributes.position.array;
            const dest = shapes[gameState.currentShape];
            for(let i=0; i<PARTICLE_COUNT*3; i++) {
                curr[i] += (dest[i] - curr[i]) * 0.08;
            }
            geometry.attributes.position.needsUpdate = true;
            particles.rotation.y += 0.002;
            renderer.render(scene, camera);
        }
        animate();

        // --- 4. Computer Vision (MediaPipe) ---
        
        // ASL Detection Logic
        function detectASL(lm) {
            // Helper: Distance between two indices
            const d = (i1, i2) => Math.hypot(lm[i1].x - lm[i2].x, lm[i1].y - lm[i2].y);
            
            // Finger States (Extended or not relative to Wrist 0)
            const wrist = lm[0];
            const isExt = (tip, pip) => d(tip, 0) > d(pip, 0); // Simple extension check

            const thumbOut = isExt(4, 2);
            const indexUp = isExt(8, 6);
            const midUp = isExt(12, 10);
            const ringUp = isExt(16, 14);
            const pinkyUp = isExt(20, 18);

            // "O" - Tips of Thumb(4) and Index(8) close, others curled?
            // Actually O is all fingers curled touching thumb.
            // Simplified: Index tip close to Thumb tip.
            if(d(4, 8) < 0.05) return "O";

            // "C" - Fingers curved (not fully closed like fist, not fully open)
            // Hard to detect curvature easily. 
            // Approximation: Thumb and Index spread apart vertically but C-shape?
            // Let's rely on Geometric relation: Index tip and Thumb tip share Y roughly, widely separated X?
            // Easier check: If "O" condition fails, but fingers aren't fully straight...
            // Let's use simpler: "C" usually implies hand is sideways. 
            // Let's do a loose check: Thumb and Index not touching, but other fingers curled/aligned?
            // Valid Approximation for Game: Thumb + Index + Middle Extended, but tips arranged in arc?
            // Actually, let's map:
            // C: Thumb Open, Index Open, Middle Open, Ring Open, Pinky Open (All somewhat curved).
            // This is hard vs Open Hand.
            // Let's try Strict Rules:
            
            // "V": Index & Middle UP. Ring & Pinky DOWN.
            if(indexUp && midUp && !ringUp && !pinkyUp) return "V";

            // "L": Index UP. Thumb OUT. Middle/Ring/Pinky DOWN.
            if(indexUp && thumbOut && !midUp && !ringUp && !pinkyUp) return "L";

            // "C": If not others, and fingers are somewhat open?
            // Let's define C as: Thumb & Index separated by medium distance, others mimic index.
            // Hack for stability: If it's not V, L, or O, and Index is Up?
            if(d(4,8) > 0.05 && d(4,8) < 0.2 && !midUp) return "C"; // C-clamp shape

            return null;
        }

        const videoElement = document.getElementById('input_video');

        function onResults(results) {
            if(gameState.phase !== 'active') return;

            const targetChar = TARGETS[gameState.targetIndex].letter;
            let p1Found = false;
            let p2Found = false;

            // Reset detections UI opacity
            uiP1Det.style.opacity = 0;
            uiP2Det.style.opacity = 0;

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    // Determine Player based on X coord of wrist (0)
                    // Video is mirrored: Left side of screen (x < 0.5) is Player 1
                    // Right side of screen (x > 0.5) is Player 2
                    const x = landmarks[0].x;
                    const isP1 = x < 0.5;

                    const gesture = detectASL(landmarks);
                    
                    if(isP1) {
                        uiP1Det.innerText = "P1: " + (gesture || "...");
                        uiP1Det.style.opacity = 1;
                        if(gesture === targetChar) p1Found = true;
                    } else {
                        uiP2Det.innerText = "P2: " + (gesture || "...");
                        uiP2Det.style.opacity = 1;
                        if(gesture === targetChar) p2Found = true;
                    }
                }
            }

            // Game Logic: Hold to win
            if(p1Found) gameState.p1HoldTime++; else gameState.p1HoldTime = 0;
            if(p2Found) gameState.p2HoldTime++; else gameState.p2HoldTime = 0;

            // Visual feedback for holding
            if(p1Found) uiP1Det.style.background = `rgba(0, 210, 255, ${Math.min(gameState.p1HoldTime/HOLD_THRESHOLD, 1)})`;
            if(p2Found) uiP2Det.style.background = `rgba(255, 0, 85, ${Math.min(gameState.p2HoldTime/HOLD_THRESHOLD, 1)})`;

            if(gameState.p1HoldTime > HOLD_THRESHOLD) handleWin(1);
            else if(gameState.p2HoldTime > HOLD_THRESHOLD) handleWin(2);
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        hands.onResults(onResults);

        const cameraFeed = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 1280, height: 720
        });

        // Initialize
        uiTarget.innerText = "Starting...";
        setTimeout(() => {
            cameraFeed.start();
            startRound();
        }, 1000);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
