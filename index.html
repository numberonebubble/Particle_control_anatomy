<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FR-CAS (First Responder Casualty Assessment System)</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Courier New', Courier, monospace; 
        }

        /* Video Layer */
        #input_video { display: none; } /* Hidden, processed via canvas */
        
        /* The Main HUD Canvas */
        #output_canvas { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover;
        }

        /* UI Overlay - Medical HUD */
        #hud-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            box-shadow: inset 0 0 50px rgba(0, 255, 255, 0.2);
        }

        .panel {
            background: rgba(0, 20, 30, 0.85);
            border: 1px solid #00aaaa;
            padding: 10px;
            color: #00ffff;
            position: absolute;
            font-size: 12px;
            backdrop-filter: blur(4px);
        }

        /* Vitals Panel (Top Left) */
        #vitals-panel { top: 20px; left: 20px; width: 180px; }
        .metric-big { font-size: 32px; font-weight: bold; color: #fff; }
        .metric-label { font-size: 10px; opacity: 0.7; text-transform: uppercase; }
        .alert { color: #ff3333; animation: flash 1s infinite; }

        /* Skin/Trauma Panel (Top Right) */
        #trauma-panel { top: 20px; right: 20px; width: 180px; text-align: right; }
        #skin-swatch { width: 100%; height: 20px; margin-top: 5px; border: 1px solid #555; }

        /* Scanning Status (Bottom) */
        #scan-bar { 
            position: absolute; bottom: 40px; left: 5%; width: 90%; 
            height: 2px; background: #004444; 
        }
        #scan-progress {
            width: 0%; height: 100%; background: #00ffff;
            box-shadow: 0 0 10px #00ffff;
            animation: scan 2s infinite linear;
        }

        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        @keyframes scan { 0% { width: 0%; opacity: 1; } 100% { width: 100%; opacity: 0; } }

        /* Loading Screen */
        #loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #00ffff; font-size: 24px; text-align: center;
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>

    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="hud-layer">
        <div id="vitals-panel" class="panel">
            <div class="metric-label">Heart Rate (POS-Algo)</div>
            <div id="bpm-val" class="metric-big">--</div>
            <div id="bpm-conf" style="color:#888; margin-bottom: 10px;">Signal: Low</div>

            <div class="metric-label">Respiration (Thoracic)</div>
            <div id="resp-val" class="metric-big">--</div>
            <div id="resp-conf" style="color:#888;">Signal: Low</div>
        </div>

        <div id="trauma-panel" class="panel">
            <div class="metric-label">Trauma / Hemorrhage</div>
            <div id="bleed-alert" style="font-weight:bold; color:#00ff00;">NO ACTIVE BLEED</div>
            
            <div class="metric-label" style="margin-top:15px;">Skin Perfusion</div>
            <div id="skin-hex">Analyzing...</div>
            <div id="skin-swatch"></div>
            <div id="shock-warning" style="display:none; color:red; font-weight:bold;">POSSIBLE SHOCK</div>
        </div>

        <div id="scan-bar"><div id="scan-progress"></div></div>
    </div>

    <div id="loader">INITIALIZING SENSORS...<br><small>Allow Camera Access</small></div>

<script>
/**
 * --------------------------------------------------------------------------
 * UTILITIES: FILTERS & MATH
 * --------------------------------------------------------------------------
 */
class BandpassFilter {
    constructor(order, lowCutoff, highCutoff, sampleRate) {
        this.x = new Array(order + 1).fill(0);
        this.y = new Array(order + 1).fill(0);
        this.calcCoefficients(lowCutoff, highCutoff, sampleRate);
    }
    calcCoefficients(low, high, rate) {
        const omegaL = Math.tan(Math.PI * low / rate);
        const omegaH = Math.tan(Math.PI * high / rate);
        const center = Math.sqrt(omegaL * omegaH);
        const width = omegaH - omegaL;
        this.gain = width / (1 + width + center*center);
        this.a1 = 2 * (center*center - 1) * this.gain / width;
        this.a2 = (1 - width + center*center) * this.gain / width;
    }
    process(input) {
        if(isNaN(input)) return 0;
        this.x.unshift(input); this.x.pop();
        let output = (this.x[0] - this.x[2]) * 1.0 - (this.y[0] * this.a1 + this.y[1] * this.a2);
        this.y.unshift(output); this.y.pop();
        return output;
    }
}

// Filters assuming ~30FPS
const hrFilter = new BandpassFilter(2, 0.7, 3.5, 30); // 42-210 BPM
const respFilter = new BandpassFilter(2, 0.1, 0.6, 30); // 6-36 BrPM

/**
 * --------------------------------------------------------------------------
 * CORE LOGIC
 * --------------------------------------------------------------------------
 */
const canvas = document.getElementById('output_canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const videoElement = document.getElementById('input_video');

// Buffers
const ppgBuffer = []; 
const respBuffer = [];
let lastProcessTime = 0;

// UI Elements
const ui = {
    bpm: document.getElementById('bpm-val'),
    bpmConf: document.getElementById('bpm-conf'),
    resp: document.getElementById('resp-val'),
    respConf: document.getElementById('resp-conf'),
    bleed: document.getElementById('bleed-alert'),
    skinHex: document.getElementById('skin-hex'),
    skinSwatch: document.getElementById('skin-swatch'),
    shock: document.getElementById('shock-warning'),
    loader: document.getElementById('loader')
};

// State
let currentBpm = 0;
let currentResp = 0;
let frameCount = 0;

function onResults(results) {
    ui.loader.style.display = 'none';

    // 1. Setup Canvas
    canvas.width = videoElement.videoWidth;
    canvas.height = videoElement.videoHeight;
    
    // 2. Spectrogram / Isolation Effect
    // Draw the raw video first
    ctx.save();
    ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
    
    // Apply environmental darkening (Spectrogram look)
    // If segmentation mask exists, we darken everything EXCEPT the body
    if (results.segmentationMask) {
        ctx.globalCompositeOperation = 'destination-in';
        ctx.drawImage(results.segmentationMask, 0, 0, canvas.width, canvas.height);
        
        // Restore context to draw background layer darkened
        ctx.globalCompositeOperation = 'destination-over';
        ctx.fillStyle = 'rgba(0, 20, 10, 0.85)'; // Dark green/black tint for environment
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();

    if (!results.poseLandmarks) {
        drawScanningGrid(); // Visual filler if no body found
        return;
    }

    const lm = results.poseLandmarks;

    // 3. Extract Regions of Interest (ROIs)
    const nose = lm[0];
    const leftShoulder = lm[11];
    const rightShoulder = lm[12];
    
    // Forehead ROI (approximate based on nose and eyes width)
    const faceWidth = Math.abs(lm[7].x - lm[8].x) * canvas.width; 
    const foreheadX = Math.floor(nose.x * canvas.width - faceWidth/2);
    const foreheadY = Math.floor(nose.y * canvas.height - faceWidth); 
    const foreheadW = Math.floor(faceWidth);
    const foreheadH = Math.floor(faceWidth * 0.6);

    // Chest ROI (between shoulders)
    const chestX = Math.floor(rightShoulder.x * canvas.width);
    const chestW = Math.floor((leftShoulder.x - rightShoulder.x) * canvas.width);
    const chestY = Math.floor(rightShoulder.y * canvas.height);
    const chestH = Math.floor(chestW * 0.8);

    // 4. Data Gathering & Drawing
    
    // A. Heart Rate (POS) & Skin Tone
    if (foreheadW > 0 && foreheadH > 0) {
        // Draw ROI Box
        ctx.strokeStyle = '#00ff00';
        ctx.lineWidth = 2;
        ctx.strokeRect(foreheadX, foreheadY, foreheadW, foreheadH);

        const faceData = ctx.getImageData(foreheadX, foreheadY, foreheadW, foreheadH);
        processFaceROI(faceData.data);
    }

    // B. Respiration (Motion)
    if (chestW > 0 && chestH > 0) {
        // Draw ROI Box
        ctx.strokeStyle = '#00ffff'; 
        ctx.strokeRect(chestX, chestY, chestW, chestH);

        // We use the raw Y position of the shoulders/chest center as the signal
        const midChestY = (leftShoulder.y + rightShoulder.y) / 2;
        // Invert Y because screen Y goes down
        processRespirationSignal(midChestY * canvas.height); 
    }

    // C. Bleeding Detection (Full Body Scan)
    // We only scan inside the body bounding box to save CPU
    const bodyBox = getBoundingBox(lm);
    detectBleeding(bodyBox);

    // D. Skeleton Overlay
    drawSkeleton(lm);

    frameCount++;
}

/**
 * --------------------------------------------------------------------------
 * ALGORITHM 1: HR (POS) & SKIN ANALYSIS
 * --------------------------------------------------------------------------
 */
function processFaceROI(data) {
    let sumR = 0, sumG = 0, sumB = 0;
    const pixelCount = data.length / 4;

    for (let i = 0; i < data.length; i += 4) {
        sumR += data[i];
        sumG += data[i+1];
        sumB += data[i+2];
    }

    const avgR = sumR / pixelCount;
    const avgG = sumG / pixelCount;
    const avgB = sumB / pixelCount;

    // 1. Skin Color Grading
    const rgbStr = `rgb(${Math.round(avgR)},${Math.round(avgG)},${Math.round(avgB)})`;
    ui.skinSwatch.style.background = rgbStr;
    ui.skinHex.innerText = `R:${Math.round(avgR)} G:${Math.round(avgG)} B:${Math.round(avgB)}`;
    
    // Shock Logic (Very simple heuristic: High Green/Blue relative to Red, or very low saturation)
    // Normal skin is R dominant.
    if (avgG > avgR || avgB > avgR) {
        ui.shock.style.display = 'block';
        ui.shock.innerText = "WARNING: CYANOSIS";
    } else if (avgR < 50 && avgG < 50 && avgB < 50) {
        ui.shock.style.display = 'block';
        ui.shock.innerText = "POOR LIGHT / PALLOR";
    } else {
        ui.shock.style.display = 'none';
    }

    // 2. HR Buffer
    const now = Date.now();
    ppgBuffer.push({ t: now, r: avgR, g: avgG, b: avgB });
    if (ppgBuffer.length > 150) ppgBuffer.shift(); // 5s window

    // Calculate HR every 1s
    if (frameCount % 30 === 0) calculateHR();
}

function calculateHR() {
    if (ppgBuffer.length < 30) return;

    // POS Algorithm
    const N = ppgBuffer.length;
    let meanR = 0, meanG = 0, meanB = 0;
    ppgBuffer.forEach(p => { meanR+=p.r; meanG+=p.g; meanB+=p.b; });
    meanR/=N; meanG/=N; meanB/=N;

    const signal = [];
    const times = [];
    let signalSum = 0;

    for (let i=0; i<N; i++) {
        const p = ppgBuffer[i];
        const rn = p.r/(meanR||1);
        const gn = p.g/(meanG||1);
        const bn = p.b/(meanB||1);
        
        // S = 3G - 2R - B (Standard POS projection)
        let raw = 3*gn - 2*rn - bn;
        let filtered = hrFilter.process(raw);
        signal.push(filtered);
        times.push(p.t);
        signalSum += Math.abs(filtered);
    }

    // Peak Detection
    const threshold = (signalSum / N) * 0.6;
    const peaks = [];
    let lastPeak = -1000;
    
    for(let i=1; i<signal.length-1; i++){
        if(signal[i]>signal[i-1] && signal[i]>signal[i+1] && signal[i]>threshold){
            if(times[i] - lastPeak > 300) { // Max 200 BPM
                peaks.push(times[i]);
                lastPeak = times[i];
            }
        }
    }

    if (peaks.length > 1) {
        const intervals = [];
        for(let i=1; i<peaks.length; i++) intervals.push((peaks[i]-peaks[i-1])/1000);
        const avgInt = intervals.reduce((a,b)=>a+b,0)/intervals.length;
        const bpm = 60/avgInt;

        if (bpm > 40 && bpm < 220) {
            currentBpm = Math.round(currentBpm * 0.7 + bpm * 0.3);
            ui.bpm.innerText = currentBpm;
            ui.bpmConf.innerText = "Signal: Locked";
            ui.bpmConf.style.color = "#00ff00";
        }
    } else {
        ui.bpmConf.innerText = "Signal: Acquiring...";
        ui.bpmConf.style.color = "#ffff00";
    }
}

/**
 * --------------------------------------------------------------------------
 * ALGORITHM 2: RESPIRATION (CHEST MOTION)
 * --------------------------------------------------------------------------
 */
function processRespirationSignal(yVal) {
    const now = Date.now();
    // Use bandpass filter immediately on the raw coordinate
    const filteredY = respFilter.process(yVal);
    
    respBuffer.push({ t: now, val: filteredY });
    if(respBuffer.length > 300) respBuffer.shift();

    if (frameCount % 30 === 0) calculateResp();
}

function calculateResp() {
    if(respBuffer.length < 60) return;

    // Zero-crossing / Peak detection on the filtered signal
    const signal = respBuffer.map(b => b.val);
    const times = respBuffer.map(b => b.t);
    
    let sumAmp = 0;
    signal.forEach(v => sumAmp += Math.abs(v));
    const threshold = (sumAmp / signal.length) * 0.5;

    const peaks = [];
    let lastPeak = -1000;

    for(let i=1; i<signal.length-1; i++){
        if(signal[i]>signal[i-1] && signal[i]>signal[i+1] && signal[i]>threshold){
            if(times[i] - lastPeak > 1000) { // Max 60 BrPM
                peaks.push(times[i]);
                lastPeak = times[i];
            }
        }
    }

    if (peaks.length > 1) {
        const intervals = [];
        for(let i=1; i<peaks.length; i++) intervals.push((peaks[i]-peaks[i-1])/1000);
        const avgInt = intervals.reduce((a,b)=>a+b,0)/intervals.length;
        const brpm = 60/avgInt;

        if (brpm > 5 && brpm < 60) {
            currentResp = Math.round(currentResp * 0.8 + brpm * 0.2);
            ui.resp.innerText = currentResp;
            ui.respConf.innerText = "Signal: Locked";
        }
    }
}

/**
 * --------------------------------------------------------------------------
 * ALGORITHM 3: HEMORRHAGE / BLEEDING DETECTION
 * --------------------------------------------------------------------------
 */
function getBoundingBox(lm) {
    let minX=1, maxX=0, minY=1, maxY=0;
    lm.forEach(p => {
        if(p.x < minX) minX = p.x;
        if(p.x > maxX) maxX = p.x;
        if(p.y < minY) minY = p.y;
        if(p.y > maxY) maxY = p.y;
    });
    return {
        x: Math.floor(minX * canvas.width),
        y: Math.floor(minY * canvas.height),
        w: Math.floor((maxX - minX) * canvas.width),
        h: Math.floor((maxY - minY) * canvas.height)
    };
}

function detectBleeding(bbox) {
    // Safety check boundaries
    if (bbox.w <= 0 || bbox.h <= 0) return;
    
    // Grab data only from the body bounding box
    const imgData = ctx.getImageData(bbox.x, bbox.y, bbox.w, bbox.h);
    const data = imgData.data;
    const w = bbox.w;
    const h = bbox.h;

    let bleedPixels = 0;
    // Optimization: Stride of 4 (check every 4th pixel) to maintain FPS
    for (let i = 0; i < data.length; i += 16) { 
        const r = data[i];
        const g = data[i+1];
        const b = data[i+2];

        // "Fresh Blood" Heuristic:
        // 1. High Red
        // 2. Red significantly higher than Green (Blood is not yellow/orange)
        // 3. Red significantly higher than Blue (Blood is not purple)
        // 4. Moderate to High Saturation
        if (r > 100 && r > g * 1.6 && r > b * 2.0) {
            bleedPixels++;
            // Mark it on screen for visual feedback (optional, costly)
            data[i] = 255; data[i+1] = 0; data[i+2] = 0; // Pure red highlight
        }
    }

    // Threshold: if > 0.5% of body area looks like blood
    const threshold = (w * h) * 0.005 / 4; // divide by 4 due to stride
    
    if (bleedPixels > threshold) {
        ui.bleed.innerText = "DETECTED";
        ui.bleed.style.color = "red";
        ui.bleed.classList.add('alert');
        
        // Put the modified pixels back to visualize the detection
        ctx.putImageData(imgData, bbox.x, bbox.y);
        
        // Draw warning box
        ctx.strokeStyle = "red";
        ctx.lineWidth = 4;
        ctx.strokeRect(bbox.x, bbox.y, bbox.w, bbox.h);
    } else {
        ui.bleed.innerText = "NO ACTIVE BLEED";
        ui.bleed.style.color = "#00ff00";
        ui.bleed.classList.remove('alert');
    }
}

/**
 * --------------------------------------------------------------------------
 * VISUALIZATION & SETUP
 * --------------------------------------------------------------------------
 */
function drawSkeleton(lm) {
    ctx.fillStyle = '#00ffff';
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
    ctx.lineWidth = 2;

    const connections = [
        [11,12], [11,13], [13,15], [12,14], [14,16], // Arms
        [11,23], [12,24], [23,24], // Torso
        [23,25], [24,26], [25,27], [26,28] // Legs
    ];

    connections.forEach(pair => {
        const A = lm[pair[0]];
        const B = lm[pair[1]];
        if(A.visibility > 0.5 && B.visibility > 0.5) {
            ctx.beginPath();
            ctx.moveTo(A.x * canvas.width, A.y * canvas.height);
            ctx.lineTo(B.x * canvas.width, B.y * canvas.height);
            ctx.stroke();
        }
    });
}

function drawScanningGrid() {
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
    ctx.lineWidth = 1;
    const step = 50;
    const timeOffset = (Date.now() / 20) % step;
    
    for (let x = 0; x < canvas.width; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }
    for (let y = timeOffset; y < canvas.height; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }
    
    ctx.fillStyle = 'rgba(0, 255, 255, 0.5)';
    ctx.font = "20px Courier";
    ctx.fillText("SEARCHING FOR SUBJECT...", canvas.width/2 - 120, canvas.height/2);
}

// Initialization
const pose = new Pose({locateFile: (file) => {
    return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
}});

pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: true, // Critical for "Spectrogram" isolation
    smoothSegmentation: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});
pose.onResults(onResults);

const camera = new Camera(videoElement, {
    onFrame: async () => {
        await pose.send({image: videoElement});
    },
    width: 1280,
    height: 720,
    facingMode: 'environment' // BACK CAMERA REQUEST
});

camera.start();

// Handle Resize
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
</body>
</html>
