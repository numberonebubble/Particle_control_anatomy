<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Curiosity Field (Gestures v2.1)</title>
  <style>
    html, body { margin:0; padding:0; overflow:hidden; background:#05060a; }
    #hud {
      position:fixed; left:16px; top:16px; color:rgba(255,255,255,.85);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      letter-spacing: .2px; font-size: 13px;
      background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px; padding: 12px 14px; backdrop-filter: blur(10px);
      user-select:none; pointer-events:none; max-width: 420px;
    }
    #hud b { color:#fff; }
    #badge {
      display:inline-block; padding:2px 8px; border-radius: 999px;
      border:1px solid rgba(255,255,255,.18); margin-left:8px;
      font-size: 12px; opacity: .9;
    }
    #hint { opacity:.75; margin-top:8px; line-height: 1.35; }
    #corner {
      position:fixed; right:16px; top:16px; text-align:right;
      font-family: ui-sans-serif, system-ui; color: rgba(255,255,255,.85);
      background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px; padding: 10px 12px; backdrop-filter: blur(10px);
      user-select:none; pointer-events:none;
    }
    #corner .k { opacity:.7; font-size: 12px; }
    #corner .v { font-size: 18px; font-weight: 700; }
    #video {
      position:fixed; left:16px; bottom:16px; width: 160px; height: 120px;
      border-radius: 12px; border:1px solid rgba(255,255,255,.12);
      opacity:.0; pointer-events:none; /* set to .9 to debug */
    }
    canvas { display:block; }
  </style>
</head>
<body>
  <div id="hud">
    <div><b>Curiosity Field</b><span id="badge">Explore</span></div>
    <div id="hint">
      Use your hands. There is no “right” way — only patterns you can discover.
      <br/>Right hand acts. Left hand modifies.
    </div>
  </div>

  <div id="corner">
    <div class="k">coherence</div>
    <div class="v" id="coh">0.00</div>
    <div class="k" style="margin-top:8px;">phase</div>
    <div class="v" id="ph">A</div>
    <div class="k" style="margin-top:8px;">filaments</div>
    <div class="v" id="fil">0</div>
  </div>

  <video id="video" playsinline></video>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.min.js"></script>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    // ============================================================
    // 0) Helpers
    // ============================================================
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp  = (a, b, t) => a + (b - a) * t;
    const now   = () => performance.now();
    const rotate90 = (vx, vy) => [-vy, vx];

    // Deterministic-ish per-run RNG (anti-memorization parameter jitter)
    function xmur3(str) {
      let h = 1779033703 ^ str.length;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = (h << 13) | (h >>> 19);
      }
      return function() {
        h = Math.imul(h ^ (h >>> 16), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        h ^= h >>> 16;
        return h >>> 0;
      };
    }
    function sfc32(a, b, c, d) {
      return function() {
        a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
        let t = (a + b) | 0;
        a = b ^ (b >>> 9);
        b = (c + (c << 3)) | 0;
        c = (c << 21) | (c >>> 11);
        d = (d + 1) | 0;
        t = (t + d) | 0;
        c = (c + t) | 0;
        return (t >>> 0) / 4294967296;
      };
    }
    const runSalt = `${Date.now()}-${Math.random()}-${navigator.userAgent}`;
    const seedGen = xmur3(runSalt);
    const rand = sfc32(seedGen(), seedGen(), seedGen(), seedGen());
    const randf = (a,b) => a + (b-a)*rand();

    function randn() {
      // Box-Muller
      let u=0, v=0;
      while(u===0) u=rand();
      while(v===0) v=rand();
      return Math.sqrt(-2.0*Math.log(u))*Math.cos(2.0*Math.PI*v);
    }
    function smoothStep(prev, next, a=0.18) { return lerp(prev, next, a); }

    // ============================================================
    // 1) Scene
    // ============================================================
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x05060a, 2, 9);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.01, 60);
    camera.position.set(0, 0, 4.2);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const light = new THREE.PointLight(0xffffff, 0.65, 80);
    light.position.set(2, 2, 4);
    scene.add(light);

    // ============================================================
    // 2) Particle Field
    // ============================================================
    const N = 1600;
    const positions = new Float32Array(N * 3);
    const colors    = new Float32Array(N * 3);
    const velocities= new Float32Array(N * 3);
    const phase     = new Float32Array(N); // hidden scalar [-1..1]

    for (let i=0;i<N;i++){
      const r = 1.35 * Math.sqrt(rand());
      const a = rand()*Math.PI*2;
      positions[3*i+0] = r*Math.cos(a) + 0.06*randn();
      positions[3*i+1] = r*Math.sin(a) + 0.06*randn();
      positions[3*i+2] = 0.30*randn();

      velocities[3*i+0] = 0.02*randn();
      velocities[3*i+1] = 0.02*randn();
      velocities[3*i+2] = 0.02*randn();

      phase[i] = (rand()*2-1);

      colors[3*i+0] = 0.7;
      colors[3*i+1] = 0.8;
      colors[3*i+2] = 1.0;
    }

    const geom = new THREE.BufferGeometry();
    geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geom.setAttribute("color", new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.PointsMaterial({
      size: 0.017,
      vertexColors: true,
      transparent: true,
      opacity: 0.95,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const points = new THREE.Points(geom, mat);
    scene.add(points);

    // ============================================================
    // 3) Emergent micro-objects: Filaments (LineSegments)
    // ============================================================
    const FIL_MAX = 700;
    const filPos = new Float32Array(FIL_MAX * 2 * 3);
    const filGeom = new THREE.BufferGeometry();
    filGeom.setAttribute("position", new THREE.BufferAttribute(filPos, 3));

    // Start filaments cool-white; we'll warm them when active
    const filMat = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.0,
      blending: THREE.AdditiveBlending
    });

    const filLines = new THREE.LineSegments(filGeom, filMat);
    scene.add(filLines);

    const filEl = document.getElementById("fil");

    function updateFilaments(coh, strength01) {
      const want = Math.floor(lerp(0, FIL_MAX, strength01));
      filEl.textContent = String(want);

      let w = 0;
      for (let s=0; s<want; s++){
        const i = Math.floor(rand()*N);
        const j = (i + 1 + Math.floor(rand()*80)) % N;

        const ix = 3*i, jx = 3*j;
        const x1 = positions[ix],   y1 = positions[ix+1],   z1 = positions[ix+2];
        const x2 = positions[jx],   y2 = positions[jx+1],   z2 = positions[jx+2];

        const dx = x2-x1, dy=y2-y1, dz=z2-z1;
        const d2 = dx*dx+dy*dy+dz*dz;
        if (d2 > 0.35) { s--; continue; }

        const vix = velocities[ix], viy = velocities[ix+1], viz = velocities[ix+2];
        const vjx = velocities[jx], vjy = velocities[jx+1], vjz = velocities[jx+2];
        const mi = Math.sqrt(vix*vix+viy*viy+viz*viz) + 1e-6;
        const mj = Math.sqrt(vjx*vjx+vjy*vjy+vjz*vjz) + 1e-6;
        const dot = (vix*vjx+viy*vjy+viz*vjz)/(mi*mj);

        if (dot < lerp(0.35, 0.75, coh)) { s--; continue; }

        filPos[w++] = x1; filPos[w++] = y1; filPos[w++] = z1;
        filPos[w++] = x2; filPos[w++] = y2; filPos[w++] = z2;
      }

      for (; w < filPos.length; w++) filPos[w] = 0;

      filGeom.attributes.position.needsUpdate = true;
      filMat.opacity = 0.02 + 0.28 * strength01;

      // Warm the filament tint slightly as it strengthens (subtle)
      // Cool white -> warm ember-white
      const warm = strength01;
      const r = lerp(1.0, 1.0, warm);
      const g = lerp(1.0, 0.80, warm);
      const b = lerp(1.0, 0.55, warm);
      filMat.color.setRGB(r, g, b);
    }

    // ============================================================
    // 4) Puzzle phases, personalized shift, parameter jitter
    // ============================================================
    const t0 = now();
    const END_AT_MS = 95000;

    let alpha   = randf(1.00, 1.65);
    let beta    = randf(0.70, 1.20);
    let gamma   = randf(0.16, 0.30);
    let noise   = randf(0.012, 0.022);
    let damping = randf(0.982, 0.989);

    const filThresh = randf(0.44, 0.56);
    const filGrowSpan = randf(0.10, 0.18);

    const stableCohThresh = randf(0.46, 0.58);
    const stableHoldMs = randf(2400, 4200);
    const shiftLatestMs = randf(65000, 78000);

    const shiftTypeRoll = rand();
    const shiftType = shiftTypeRoll < 0.45 ? "PINCH_SIGN" : (shiftTypeRoll < 0.85 ? "SWIRL_SIGN" : "COUPLING_DROP");

    let pinchSign = +1;
    let swirlSign = +1;

    let modCoupling = 1.0;
    let modRadius   = 1.0;
    let modAxisLock = 0.0;

    let shifted = false;
    let stableSince = null;

    // ============================================================
    // 5) Hand tracking
    // ============================================================
    const videoEl = document.getElementById("video");
    const badgeEl = document.getElementById("badge");
    const cohEl   = document.getElementById("coh");
    const phEl    = document.getElementById("ph");

    function dist2(a, b) {
      const dx = a.x - b.x, dy = a.y - b.y;
      return dx*dx + dy*dy;
    }
    function fingerExtended(lm, tipIdx, pipIdx) {
      return lm[tipIdx].y < lm[pipIdx].y;
    }
    function classifyGesture(lm) {
      const idxExt  = fingerExtended(lm, 8, 6);
      const midExt  = fingerExtended(lm, 12, 10);
      const ringExt = fingerExtended(lm, 16, 14);
      const pinkExt = fingerExtended(lm, 20, 18);

      const pinch = dist2(lm[4], lm[8]) < 0.0022;

      const point = idxExt && !(midExt || ringExt || pinkExt);
      const open  = idxExt && midExt && ringExt && pinkExt && !pinch;
      const fist  = !(idxExt || midExt || ringExt || pinkExt) && !pinch;

      if (pinch) return "PINCH";
      if (open)  return "OPEN";
      if (point) return "POINT";
      if (fist)  return "FIST";
      return "UNKNOWN";
    }

    const handState = {
      right: { present:false, x:0, y:0, vx:0, vy:0, gesture:"UNKNOWN", gSmooth:"UNKNOWN" },
      left:  { present:false, x:0, y:0, vx:0, vy:0, gesture:"UNKNOWN", gSmooth:"UNKNOWN" },
    };

    function updateHand(which, lm) {
      const cx = lm[9].x;
      const cy = lm[9].y;

      const wx = (cx - 0.5) * 3.3;
      const wy = -(cy - 0.5) * 2.1;

      const hs = handState[which];
      hs.present = true;
      hs.vx = smoothStep(hs.vx, (wx - hs.x), 0.25);
      hs.vy = smoothStep(hs.vy, (wy - hs.y), 0.25);
      hs.x  = smoothStep(hs.x, wx, 0.22);
      hs.y  = smoothStep(hs.y, wy, 0.22);

      const g = classifyGesture(lm);
      hs.gesture = g;

      if (hs._lastG === g) hs._gCount = (hs._gCount || 0) + 1;
      else { hs._lastG = g; hs._gCount = 0; }

      hs.gSmooth = (hs._gCount > 3) ? g : hs.gSmooth;
    }

    function clearHands() {
      handState.right.present = false;
      handState.left.present  = false;
    }

    const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}` });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      clearHands();
      if (!results.multiHandLandmarks || !results.multiHandedness) return;

      for (let i=0;i<results.multiHandLandmarks.length;i++){
        const lm = results.multiHandLandmarks[i];
        const handed = results.multiHandedness[i].label;
        if (handed === "Right") updateHand("right", lm);
        if (handed === "Left")  updateHand("left",  lm);
      }
    });

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
      videoEl.srcObject = stream;
      await videoEl.play();

      const cam = new Camera(videoEl, {
        onFrame: async () => { await hands.send({ image: videoEl }); },
        width: 640,
        height: 480
      });
      cam.start();
    }

    startCamera().catch(err => {
      badgeEl.textContent = "Camera blocked";
      document.getElementById("hint").innerHTML =
        "Camera permission is needed for gesture control.<br/>Enable it and reload.";
      console.error(err);
    });

    // ============================================================
    // 6) Combo inventory logger (counts + timeline)
    // ============================================================
    const VALID_L = new Set(["OPEN","FIST","PINCH","POINT","UNKNOWN","NONE"]);
    const VALID_R = new Set(["OPEN","FIST","PINCH","POINT","UNKNOWN","NONE"]);

    const comboCounts = new Map(); // key: "L=OPEN|R=PINCH"
    const comboTimeline = [];      // events: {t, phase, L, R, coh}

    let lastComboKey = null;
    let lastComboChangeT = 0;

    function comboKey(L, R) { return `L=${L}|R=${R}`; }

    function recordComboEvent(t, phaseLabel, L, R, coh) {
      if (!VALID_L.has(L)) L = "UNKNOWN";
      if (!VALID_R.has(R)) R = "UNKNOWN";

      const key = comboKey(L, R);

      // Count only meaningful combos where right hand is doing a known gesture
      // (This prevents noise from spamming your inventory.)
      const meaningful = (R !== "NONE" && R !== "UNKNOWN");

      // Debounce: record a "combo event" only when combo changes and holds for a beat
      const changed = (key !== lastComboKey);
      if (changed) {
        lastComboKey = key;
        lastComboChangeT = t;
        return;
      }

      // held long enough?
      if (!meaningful) return;
      if (t - lastComboChangeT < 250) return; // 250ms hold

      // Record an event at most once per hold window
      const lastEvt = comboTimeline.at(-1);
      if (lastEvt && lastEvt.key === key && (t - lastEvt.t) < 600) return;

      // increment count
      comboCounts.set(key, (comboCounts.get(key) || 0) + 1);

      comboTimeline.push({
        t: Math.round(t),
        phase: phaseLabel,
        L, R,
        coh: +coh.toFixed(3),
        key
      });
    }

    // ============================================================
    // 7) Logging for CI + entropy proxy
    // ============================================================
    const logs = {
      t: [],
      coherence: [],
      speed: [],
      rightGesture: [],
      leftGesture: [],
      rightX: [],
      rightY: [],
      leftX: [],
      leftY: [],
      phase: [],
      actEntropy: [],
      filStrength: []
    };

    // Action entropy proxy: bin right-hand positions into 8x8 grid
    const BIN = 8;
    const binCounts = new Array(BIN*BIN).fill(0);
    function updateEntropySample(rx, ry) {
      const nx = clamp((rx/3.3 + 0.5), 0, 0.999);
      const ny = clamp((-ry/2.1 + 0.5), 0, 0.999);
      const bx = Math.floor(nx * BIN);
      const by = Math.floor(ny * BIN);
      binCounts[by*BIN + bx]++;

      let total = 0;
      for (const c of binCounts) total += c;

      let H = 0;
      for (const c of binCounts) {
        if (!c) continue;
        const p = c / total;
        H += -p * Math.log(p);
      }
      return H / Math.log(BIN*BIN);
    }

    // ============================================================
    // 8) Gesture grammar
    // ============================================================
    function applyLeftModifiers(g) {
      modCoupling = 1.0;
      modRadius   = 1.0;
      modAxisLock = 0.0;

      if (g === "OPEN") { modCoupling = 1.65; }
      else if (g === "FIST") { modCoupling = 0.72; }
      else if (g === "PINCH") { modRadius = 0.65; }
      else if (g === "POINT") { modAxisLock = 1.0; }
    }

    function grammar(L, R, handSpeed) {
      const sp = clamp(handSpeed, 0.0, 0.22);
      const base = clamp(0.65 + sp*3.0, 0.55, 1.9);

      let radial = 0, swirl = 0, pulse = 0, beam = 0;
      let alignBoost = 0;
      let noiseBoost = 0;
      let filamentBoost = 0;

      if (R === "PINCH") radial = 1.0 * base;
      else if (R === "OPEN") swirl = 1.0 * base;
      else if (R === "FIST") pulse = 1.0 * base;
      else if (R === "POINT") beam = 1.0 * base;

      if (L === "OPEN") {
        radial *= 1.15; swirl *= 1.18; pulse *= 0.85; beam *= 1.10;
        alignBoost = 0.10 * base;
        filamentBoost = 0.20 * base;
      } else if (L === "FIST") {
        radial *= 0.85; swirl *= 1.15; pulse *= 1.25; beam *= 1.05;
        noiseBoost = 0.012 * base;
      } else if (L === "PINCH") {
        radial *= 1.25; swirl *= 1.10; pulse *= 0.95; beam *= 1.20;
      } else if (L === "POINT") {
        radial *= 1.10; swirl *= 1.08; pulse *= 0.90; beam *= 1.15;
        alignBoost = 0.06 * base;
      }

      return { radial, swirl, pulse, beam, alignBoost, noiseBoost, filamentBoost };
    }

    // ============================================================
    // 9) Physics / visuals
    // ============================================================
    function computeCoherence() {
      let mx=0, my=0, mz=0;
      for (let i=0;i<N;i++){
        const vx = velocities[3*i+0], vy = velocities[3*i+1], vz = velocities[3*i+2];
        const mag = Math.sqrt(vx*vx+vy*vy+vz*vz) + 1e-6;
        mx += vx/mag; my += vy/mag; mz += vz/mag;
      }
      mx/=N; my/=N; mz/=N;
      return Math.sqrt(mx*mx+my*my+mz*mz);
    }

    function meanSpeed() {
      let s=0;
      for (let i=0;i<N;i++){
        const vx = velocities[3*i+0], vy = velocities[3*i+1], vz = velocities[3*i+2];
        s += Math.sqrt(vx*vx+vy*vy+vz*vz);
      }
      return s/N;
    }

    function applyGlobalAlignment(gain) {
      let mvx=0,mvy=0,mvz=0;
      for (let i=0;i<N;i++){
        mvx += velocities[3*i+0];
        mvy += velocities[3*i+1];
        mvz += velocities[3*i+2];
      }
      mvx/=N; mvy/=N; mvz/=N;

      for (let i=0;i<N;i++){
        velocities[3*i+0] += gain * (mvx - velocities[3*i+0]);
        velocities[3*i+1] += gain * (mvy - velocities[3*i+1]);
        velocities[3*i+2] += gain * (mvz - velocities[3*i+2]);
      }
    }

    // Colour shift when filaments form:
    // cool palette -> warmer ember palette as filStrength rises
    function updateColorsFromCoherenceAndFilaments(coh, filStrength) {
      const brightness = clamp(0.30 + coh*0.90, 0.22, 1.0);

      // Warm tint strength is driven by filaments
      const warm = clamp(filStrength, 0, 1);

      // Two base palettes:
      // cool: (r,g,b) bias ~ (0.18,0.30,0.72)
      // warm: (r,g,b) bias ~ (0.95,0.55,0.25) but we keep it tasteful
      const baseCool = { r: 0.18, g: 0.30, b: 0.72 };
      const baseWarm = { r: 0.95, g: 0.62, b: 0.28 };

      for (let i=0;i<N;i++){
        const p = (phase[i] * 0.5 + 0.5); // 0..1 micro-variation

        const br = lerp(baseCool.r, baseWarm.r, warm);
        const bg = lerp(baseCool.g, baseWarm.g, warm);
        const bb = lerp(baseCool.b, baseWarm.b, warm);

        // brightness and phase micro-variation
        const r = lerp(br, 0.98, brightness) * lerp(0.62, 1.0, p);
        const g = lerp(bg, 0.99, brightness) * lerp(0.74, 1.0, 1.0-p*0.30);
        const b = lerp(bb, 1.00, brightness) * lerp(0.75, 1.0, 0.55 + 0.45*(1.0-warm));

        colors[3*i+0] = r;
        colors[3*i+1] = g;
        colors[3*i+2] = b;
      }
      geom.attributes.color.needsUpdate = true;
    }

    function enforceBounds(i) {
      const x = positions[3*i+0], y = positions[3*i+1], z = positions[3*i+2];
      const r = Math.sqrt(x*x + y*y + z*z);
      const R = 2.05;
      if (r > R) {
        const k = (r - R) * 0.016;
        velocities[3*i+0] -= k * (x/r);
        velocities[3*i+1] -= k * (y/r);
        velocities[3*i+2] -= k * (z/r);
      }
    }

    // ============================================================
    // 10) Personalized shift logic
    // ============================================================
    function maybeTriggerShift(t, coh, phaseLabel) {
      if (shifted) return;
      if (t < 18000) return;

      const active = handState.right.present;

      if (active && coh >= stableCohThresh && phaseLabel !== "C") {
        if (stableSince === null) stableSince = t;
        const held = t - stableSince;
        if (held >= stableHoldMs) {
          shifted = true;
          applyShift();
          return;
        }
      } else {
        stableSince = null;
      }

      if (t >= shiftLatestMs) {
        shifted = true;
        applyShift();
      }
    }

    function applyShift() {
      if (shiftType === "PINCH_SIGN") pinchSign *= -1;
      else if (shiftType === "SWIRL_SIGN") swirlSign *= -1;
      else if (shiftType === "COUPLING_DROP") gamma *= 0.65;

      noise *= randf(0.92, 1.12);
    }

    // ============================================================
    // 11) CI computation (same as v2, includes entropy + filStrength)
    // ============================================================
    function computeCI() {
      const norm01 = (x, a, b) => clamp((x - a) / (b - a + 1e-9), 0, 1);
      const T = logs.t.length;
      if (T < 12) return null;

      let shiftT = null;
      for (let i=0;i<T;i++){
        if (logs.phase[i] === "C") { shiftT = logs.t[i]; break; }
      }
      if (shiftT === null) shiftT = logs.t[Math.floor(T*0.65)];

      const pre = [], post = [];
      for (let i=0;i<T;i++){
        if (logs.t[i] < shiftT) pre.push(i);
        else post.push(i);
      }

      const mean = (arr, f) => arr.reduce((s,i)=>s+f(i),0)/(arr.length||1);
      const slope = (arr, f) => {
        const mt = mean(arr, i=>logs.t[i]);
        const my = mean(arr, i=>f(i));
        let num=0, den=0;
        for (const i of arr){
          const dt = logs.t[i]-mt;
          num += dt*(f(i)-my);
          den += dt*dt;
        }
        return num/(den+1e-9);
      };

      const uniq = (arr) => new Set(arr).size;
      const rightGuniq = uniq(logs.rightGesture.filter(g=>g!=="UNKNOWN" && g!=="NONE"));
      const leftGuniq  = uniq(logs.leftGesture.filter(g=>g!=="UNKNOWN" && g!=="NONE"));

      const entEarly = mean(pre.filter(i=>logs.t[i]<25000), i=>logs.actEntropy[i] ?? 0);
      const E = norm01((rightGuniq + 0.7*leftGuniq + 1.2*entEarly), 1.0, 5.5);

      const early = pre.filter(i => logs.t[i] < 35000);
      const cohSlopeEarly = slope(early, i=>logs.coherence[i]);
      const entSlopeEarly = slope(early, i=>logs.actEntropy[i] ?? 0);
      const M = norm01((cohSlopeEarly*100000) + (-entSlopeEarly*60000), -0.2, 1.4);

      const postCohSlope = slope(post, i=>logs.coherence[i]);
      const P = norm01(postCohSlope*100000, -0.6, 1.2);

      function dominantGesture(indices) {
        const counts = new Map();
        for (const i of indices) {
          const g = logs.rightGesture[i];
          if (g==="UNKNOWN" || g==="NONE") continue;
          counts.set(g, (counts.get(g)||0)+1);
        }
        let best="UNKNOWN", bestC=0;
        for (const [g,c] of counts.entries()){
          if (c>bestC){bestC=c; best=g;}
        }
        return best;
      }

      const domPre = dominantGesture(pre.slice(-Math.min(60, pre.length)));

      let adaptMs = 99999;
      for (let i=0;i<T;i++){
        if (logs.t[i] < shiftT) continue;

        const window = [];
        for (let j=i;j<T && logs.t[j] < logs.t[i] + 1100;j++) window.push(j);
        if (window.length < 8) continue;

        let diff=0, total=0;
        for (const j of window){
          const g = logs.rightGesture[j];
          if (g==="UNKNOWN" || g==="NONE") continue;
          total++;
          if (g !== domPre) diff++;
        }
        if (total >= 6 && diff/total >= 0.75) { adaptMs = logs.t[i]-shiftT; break; }
      }
      const A = 1.0 - norm01(adaptMs, 900, 13000);

      const cohPost = mean(post, i=>logs.coherence[i]);
      const entPost = mean(post, i=>logs.actEntropy[i] ?? 0);
      const filPost = mean(post, i=>logs.filStrength[i] ?? 0);
      const D = norm01((cohPost*0.7 + entPost*0.45 + filPost*0.35), 0.12, 1.2);

      const vec = { E:+E.toFixed(3), M:+M.toFixed(3), P:+P.toFixed(3), A:+A.toFixed(3), D:+D.toFixed(3) };
      const mag = Math.sqrt(E*E+M*M+P*P+A*A+D*D);

      return {
        vec,
        mag:+mag.toFixed(3),
        shiftT: Math.round(shiftT),
        shiftType,
        stableCohThresh:+stableCohThresh.toFixed(2),
        stableHoldMs: Math.round(stableHoldMs),
        params: {
          alpha:+alpha.toFixed(3), beta:+beta.toFixed(3), gamma:+gamma.toFixed(3),
          noise:+noise.toFixed(4), damping:+damping.toFixed(4),
          filThresh:+filThresh.toFixed(3), filGrowSpan:+filGrowSpan.toFixed(3)
        }
      };
    }

    // ============================================================
    // 12) Main loop
    // ============================================================
    let last = now();
    let lastLog = now();

    function animate() {
      requestAnimationFrame(animate);

      const t = now() - t0;
      const dt = Math.min(0.033, (now() - last)/1000);
      last = now();

      // Phase label
      let phaseLabel = "A";
      if (t > 32000 && !shifted) phaseLabel = "B";
      if (shifted) phaseLabel = "C";
      phEl.textContent = phaseLabel;

      badgeEl.textContent = shifted ? "Adapt" : (t < 2500 ? "Explore" : (phaseLabel==="B" ? "Refine" : "Discover"));

      // Left modifiers
      const leftG = handState.left.present ? handState.left.gSmooth : "UNKNOWN";
      applyLeftModifiers(leftG);

      // Right actuation
      const rightG = handState.right.present ? handState.right.gSmooth : "UNKNOWN";
      const rx = handState.right.x, ry = handState.right.y;
      const rvx = handState.right.vx, rvy = handState.right.vy;
      const handSpeed = Math.sqrt(rvx*rvx + rvy*rvy);

      const intent = grammar(leftG, rightG, handSpeed);

      // Global alignment
      const phaseGamma = gamma * modCoupling * (phaseLabel==="B" ? 1.35 : 1.0) * (phaseLabel==="C" ? 1.10 : 1.0);
      const phaseNoise = noise * (phaseLabel==="B" ? 0.82 : 1.0) * (phaseLabel==="C" ? 0.94 : 1.0) + intent.noiseBoost;
      const axisLock = modAxisLock;

      applyGlobalAlignment((phaseGamma + intent.alignBoost*0.10) * dt);

      // Per particle update
      const R0 = 0.55 * modRadius;
      const k = 1.35;
      const eps = 0.03;

      for (let i=0;i<N;i++){
        const ix = 3*i;
        let x = positions[ix], y = positions[ix+1], z = positions[ix+2];
        let vx = velocities[ix], vy = velocities[ix+1], vz = velocities[ix+2];

        vx += phaseNoise * randn() * dt;
        vy += phaseNoise * randn() * dt;
        vz += (phaseNoise*0.6) * randn() * dt;

        if (handState.right.present) {
          const dx = rx - x;
          const dy = ry - y;
          const d2 = dx*dx + dy*dy;
          const d  = Math.sqrt(d2) + 1e-6;
          const rGate = Math.exp(-d2 / (R0*R0 + 1e-6));

          const nx = dx / (d + 1e-6);
          const ny = dy / (d + 1e-6);
          const inv = 1.0 / (Math.pow(d + eps, k));

          if (intent.radial > 0 && rightG==="PINCH") {
            const f = alpha * intent.radial * pinchSign * inv * rGate;
            vx += f * nx * dt;
            vy += f * ny * dt;
          }

          if (intent.swirl > 0 && rightG==="OPEN") {
            const [tx, ty] = rotate90(nx, ny);
            const f = beta * intent.swirl * swirlSign * inv * rGate;
            vx += f * tx * dt;
            vy += f * ty * dt;
          }

          if (intent.pulse > 0 && rightG==="FIST") {
            const f = 0.95 * intent.pulse * inv * rGate;
            vx += f * (-nx) * dt;
            vy += f * (-ny) * dt;

            if (leftG === "OPEN") {
              vx *= 0.985;
              vy *= 0.985;
              vz *= 0.985;
            }
          }

          if (intent.beam > 0 && rightG==="POINT") {
            const hvx = clamp(rvx, -0.25, 0.25);
            const hvy = clamp(rvy, -0.25, 0.25);
            const f = 1.15 * intent.beam * inv * rGate;
            vx += f * hvx * dt;
            vy += f * hvy * dt;
          }
        }

        if (axisLock > 0) {
          vx += (-x) * 0.085 * axisLock * dt;
        }

        vx *= damping; vy *= damping; vz *= damping;
        x += vx; y += vy; z += vz;

        positions[ix]   = x; positions[ix+1] = y; positions[ix+2] = z;
        velocities[ix]  = vx; velocities[ix+1] = vy; velocities[ix+2] = vz;

        enforceBounds(i);
        phase[i] = clamp(phase[i] + 0.0022*randn()*dt, -1, 1);
      }

      geom.attributes.position.needsUpdate = true;

      // Coherence, filaments, colour shifts
      const coh = computeCoherence();
      cohEl.textContent = coh.toFixed(2);

      // Filament strength: based on coherence + left/right “cohere” intent
      const boost = clamp(intent.filamentBoost * 0.20, 0, 0.25);
      const filStrength = clamp((coh - filThresh) / (filGrowSpan) + boost, 0, 1);

      updateFilaments(coh, filStrength);
      updateColorsFromCoherenceAndFilaments(coh, filStrength);

      // Personalized shift trigger
      maybeTriggerShift(t, coh, phaseLabel);

      // Combo inventory logger (debounced)
      const L = handState.left.present ? handState.left.gSmooth : "NONE";
      const R = handState.right.present ? handState.right.gSmooth : "NONE";
      recordComboEvent(t, phaseLabel, L, R, coh);

      // End
      if (t > END_AT_MS) {
        const ci = computeCI();
        badgeEl.textContent = "Done";
        if (ci) {
          const comboCountsObj = Object.fromEntries([...comboCounts.entries()].sort((a,b)=>b[1]-a[1]));
          console.log("Curiosity Index (v2.1):", ci);
          console.log("Gesture Combo Counts (sorted):", comboCountsObj);
          console.log("Gesture Combo Timeline (first 80):", comboTimeline.slice(0, 80));
          console.log("Gesture Combo Timeline (full):", comboTimeline);

          document.getElementById("hint").innerHTML =
            "Done. (CI + combo inventory logged to console.)<br/>Refresh to try again (new run DNA each time).";
        }
        damping = 0.992;
        noise = 0.004;
      }

      // Log at ~15Hz
      const tNow = now();
      if (tNow - lastLog > 66) {
        lastLog = tNow;
        logs.t.push(t);
        logs.coherence.push(coh);
        logs.speed.push(meanSpeed());
        logs.rightGesture.push(handState.right.present ? handState.right.gSmooth : "NONE");
        logs.leftGesture.push(handState.left.present ? handState.left.gSmooth : "NONE");
        logs.rightX.push(handState.right.present ? handState.right.x : 0);
        logs.rightY.push(handState.right.present ? handState.right.y : 0);
        logs.leftX.push(handState.left.present ? handState.left.x : 0);
        logs.leftY.push(handState.left.present ? handState.left.y : 0);
        logs.phase.push(shifted ? "C" : (t > 32000 ? "B" : "A"));

        const H = (handState.right.present) ? updateEntropySample(handState.right.x, handState.right.y) : (logs.actEntropy.at(-1) ?? 0);
        logs.actEntropy.push(H);
        logs.filStrength.push(filStrength);
      }

      // Camera wobble
      const wobble = 0.06;
      camera.position.x = Math.sin((t*0.00025)) * wobble;
      camera.position.y = Math.cos((t*0.00022)) * wobble * 0.6;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }

    animate();
  </script>
